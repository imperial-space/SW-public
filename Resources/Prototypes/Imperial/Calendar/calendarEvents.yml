# 7. Кровавая луна   Она должна задаваться кодом системы ликантропии. Сначала система календаря заполняет календарь, а потом система ликантроии при запуске раунда должна заменить седьмую ночь на эту
- type: calendarEvent
  id: CalendarEventBloodMoonNight
  texture: "/Textures/Imperial/Medieval/Calendar/indicators/moon.png"
  name: calendar-event-blood-moon-name
  text: calendar-event-blood-moon-desc
  sound:
    path: "/Audio/Effects/church_bell1.ogg"
  weight: 1.0
  minDay: 5
  maxOccurrences: 1
  tags:
    - BloodMoon
