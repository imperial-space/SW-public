    path: "/Audio/Effects/church_bell1.ogg"

# Базовый ночной фоллбэк
- type: calendarEvent
  id: DefaultCalendarNightEvent
  texture: "/Textures/Imperial/Medieval/Calendar/indicators/moon.png"
  name: calendar-event-default-night-name
  text: calendar-event-default-night-desc
  sound:
    path: "/Audio/Effects/church_bell1.ogg"

# ==============================================================================
# ДНЕВНЫЕ СОБЫТИЯ (Тег: Day)
# ==============================================================================

# 1. Обычный ясный день
- type: calendarEvent
  id: CalendarEventSunnyDay
  texture: "/Textures/Imperial/Medieval/Calendar/indicators/sun.png"
  name: calendar-event-sunny-name
  text: calendar-event-sunny-desc
  sound:
    path: "/Audio/Effects/church_bell1.ogg"
  weight: 20.0
  maxOccurrences: 100 # Дни заполнители не должны иметь ограничений на количество появлений
  minDay: 1 # Могут начинаться сразу же
  minOffset: 1 # Дни заполнители не должны иметь оффсет
  tags:
    - Day

# 2. Дождливый пасмурный день
- type: calendarEvent
  id: CalendarEventRainyDay
  texture: "/Textures/Imperial/Medieval/Calendar/indicators/sun.png"
  name: calendar-event-rain-name
  text: calendar-event-rain-desc
  sound:
    path: "/Audio/Effects/church_bell1.ogg"
  weight: 0.0
  minDay: 1
  minOffset: 2
  tags:
    - Day

# 3. Торговая ярмарка
- type: calendarEvent
  id: CalendarEventFairDay
  texture: "/Textures/Imperial/Medieval/Calendar/indicators/sun.png"
  name: calendar-event-fair-name
  text: calendar-event-fair-desc
  sound:
    path: "/Audio/Effects/church_bell1.ogg"
  weight: 10.0 # Базовый вес, если кривой нет
  weightCurve:
    points:
      - 1, 0.05  # В первый день шанс крайне мал
      - 4, 0.05  # прямая до четвертого дня
      - 5, 150000.0  # К пятому дню шанс возрастает
      - 6, 0.0 # На шестой день и после событие не появится
  minDay: 3
  minPlayers: 1 # Нужно минимум 1 игрок для включения этого ивента
  maxPlayers: 15 # Если будет больше 15, то ивент не будет включен
  maxOccurrences: 1
  minOffset: 2
  tags:
    - Day
    - TradeEvent
  spawns:
    MobHuman:
      - FairSpawnMarker1
      - FairSpawnMarker2 # Нужно навесить на объект в мире компонент CalendarSpawnMarkerComponent и указать там айди такой же как
    CrowbarRed:
      - "Global" # Если не важно где появится прототип (допустим это спавн прототипа для триггера ивента). Это конечно можно было бы сделать и если бы маперы добавили просто объект с айди Global

# 4. Солнечное затмение
- type: calendarEvent
  id: CalendarEventEclipseDay
  texture: "/Textures/Imperial/Medieval/Calendar/indicators/sun.png"
  name: calendar-event-eclipse-name
  text: calendar-event-eclipse-desc
  sound:
    path: "/Audio/Effects/church_bell1.ogg"
  weight: 100
  minDay: 7
  maxOccurrences: 1
  tags:
    - Day
    - Omen

