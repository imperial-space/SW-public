- type: entity
  id: MedievalBloodRuby
  parent: BaseItem
  name: blood ruby
  description: A white ruby waiting for its owner's blood.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Nocturn/BloodRuby/blood_ruby.rsi
    layers:
    - state: icon
    - state: fill-icon
      color: "#FFFFFF00"
      map: [ "bloodFill" ]
  - type: Item
    size: Tiny
    sprite: Imperial/Medieval/Nocturn/BloodRuby/blood_ruby.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: bloodFill
    inhandVisuals:
      left:
      - state: fill-inhand-left
        color: "#FFFFFF00"
      right:
      - state: fill-inhand-right
        color: "#FFFFFF00"
  - type: BloodRuby
  - type: Undrowable
