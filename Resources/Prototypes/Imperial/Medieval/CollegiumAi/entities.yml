# The Collegium watcher and the statue it is bound to.

# The watcher itself. Incorporeal, so it drifts through walls and cannot be touched; the statue is its only weak point.
- type: entity
  id: MobMedievalCollegiumAi
  parent:
  - Incorporeal
  - BaseMob
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: CollegiumAi
    faction: Collegium
  - type: Sprite
    sprite: Imperial/Medieval/CollegiumAi/watcher.rsi
    drawdepth: Ghosts
    noRot: true
    layers:
    - state: watcher
      shader: unshaded
  - type: PointLight
    radius: 3
    energy: 1.5
    color: "#b48ee8"
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 7.5
  # Eye, ContentEye, Actions, Alerts and Input all come from BaseControllable; only the overrides are listed.
  - type: Eye
    drawFov: false
  - type: Examiner
    skipChecks: true
  - type: Speech
  - type: Emoting
  - type: LanguageSpeaker
    languages:
      Common: Speak
  - type: UniversalLanguageSpeaker
  # Telepathy to the whole Collegium, the same channel the comms crystals use.
  - type: CloackMessage
    action: ActionMedievalCollegiumAiBroadcast
    faction: "collegium"
  # The watcher carries no crystal, so it needs its own receiver to hear the channel it can talk on.
  - type: CloackReciever
    faction: "collegium"
  # Restricts sight to whatever the Collegium mages themselves can see.
  - type: StationAiOverlay
  - type: NoFTL
  - type: FTLSmashImmune
  - type: CargoSellBlacklist
  - type: Tag
    tags:
    - HideContextMenu
    - BypassInteractionRangeChecks

# The statue. Mapped once in the Collegium tower; destroying it banishes the watcher for the round.
- type: entity
  id: MedievalCollegiumAiStatue
  parent: BaseStructure
  components:
  - type: CollegiumAiCore
    faction: Collegium
  - type: ContainerContainer
    containers:
      collegium_ai_mind_slot: !type:ContainerSlot
        showEnts: False
  - type: ContainerSpawnPoint
    containerId: collegium_ai_mind_slot
    job: MedievalCollegiumAi
  # Seeds sight the same way the barrier does, so the watcher can hold station over its own statue.
  # Only covers this grid, and only while the statue is near the viewport.
  - type: StationAiVision
    range: 28
    occluded: false
  - type: Sprite
    sprite: Imperial/Medieval/statues.rsi
    drawdepth: Mobs
    noRot: true
    offset: "0.0,0.5"
    layers:
    - state: wizard
      map: [ "base" ]
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - Impassable
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - BulletImpassable
        - InteractImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MedievalStatueWizardBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
