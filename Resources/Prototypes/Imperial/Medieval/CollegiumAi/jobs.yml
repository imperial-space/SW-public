- type: playTimeTracker
  id: JobMedievalCollegiumAi

- type: jobIcon
  parent: JobIcon
  id: JobIconMedievalCollegiumAi
  icon:
    sprite: /Textures/Imperial/Medieval/Misc/job_icons.rsi
    state: collegium_leader
  jobName: job-name-collegiumAi-medieval

- type: job
  id: MedievalCollegiumAi
  name: job-name-collegiumAi-medieval
  description: job-description-collegiumAi-medieval
  playTimeTracker: JobMedievalCollegiumAi
  requirements:
  - !type:DepartmentTimeRequirement
    department: Collegium
    time: 50400 #Imperial role timers
  - !type:RoleTimeRequirement
    role: JobMedievalCollegiumLeader
    time: 18000 # 5 hrs as archmage
  canBeAntag: false
  icon: JobIconMedievalCollegiumAi
  # Spawns straight into the statue container; the watcher lets itself out once a player takes the wheel.
  jobEntity: MobMedievalCollegiumAi
  applyTraits: false
  # The watcher has no body, so character skills are meaningless on it and low Vitality would make it
  # grunt and complain about its back.
  applySkills: false
