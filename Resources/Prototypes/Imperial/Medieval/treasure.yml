- type: entity
  id: MedievalTreasureBoard
  name: treasure map board
  description: Old maps appear here from time to time.
  placement:
    mode: SnapgridCenter
  components:
  - type: WallMount
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/noticeboard.rsi
    layers:
    - state: noticeboard
    - state: notice-0
    - map: ["enum.StorageFillLayers.Fill"]
  - type: StorageFillVisualizer
    maxFillLevels: 6
    fillBaseName: notice
  - type: TreasureBoard
    minimumSpawnDelay: 10m
    maximumSpawnDelay: 15m
  - type: Appearance
  - type: InteractionOutline
  - type: Clickable
  - type: Transform
    anchored: true
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Small
    whitelist:
      components:
      - TreasureMap
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Tag
    tags:
    - Wooden
  - type: Construction
    graph: NoticeBoard
    node: noticeBoard

- type: entity
  id: MedievalTreasureMap
  name: treasure map
  description: A worn sheet covered with lines and faded symbols.
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Misc/treasure_map.rsi
    state: treasure_map
  - type: Item
    size: Small
  - type: TreasureMap

- type: entity
  id: MedievalTreasureMarker
  name: treasure marker
  categories: [ HideSpawnMenu ]
  components:
  - type: TreasureMarker

- type: entity
  id: MedievalTreasureChest
  name: buried treasure chest
  description: A heavy chest unearthed from beneath the ground.
  parent: MedievalCrateGeneric
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Decor/treasure_chest.rsi
    layers:
    - state: base
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Icon
    sprite: Imperial/Medieval/Decor/treasure_chest.rsi
    state: base
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 135
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: UniversalLockable
  - type: ResistLocker
    resistTime: 60
  - type: Lock
    locked: false
    showLockVerbs: false
    showExamine: false
    lockOnClick: false
    unlockOnClick: false
    useAccess: false
    unlockingSound: null
    lockingSound: null
    breakOnAccessBreaker: false
  - type: ItemSlots
    slots:
      lockSlot:
        name: Lock
        ejectOnBreak: true
        insertSound: null
        ejectSound: /Audio/Effects/unbuckle.ogg
        whitelist:
          components:
          - UniversalLock
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: MedievalTreasureChestLootTable

- type: entityTable
  id: MedievalTreasureChestLootTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: MedievalTreasureChestGoldenRoll
      rolls: 4
    - id: MedievalRevent25
      rolls: 20
      prob: 0.5

