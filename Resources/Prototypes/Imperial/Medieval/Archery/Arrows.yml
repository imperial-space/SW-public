- type: entity
  id: BasePoiseArrow
  parent: BaseArrow
  abstract: true
  components:
  - type: RDWeight
    value: 0.05
  - type: Projectile
    damage:
      types:
        Piercing: 0
  - type: PoiseArchery
    damageType: Piercing
    fixedDamage: 5
    damageMultiplier: 0.7
    bluntMultiplier: 0.7
    minPoiseMultiplier: 0.25
    maxPoiseMultiplier: 1

# Normal arrow.
- type: entity
  id: MedievalNormalArrow
  parent: BasePoiseArrow
  name: arrow
  components:
  - type: Sprite
    layers:
    - state: tail
      color: red
    - state: rod
      color: "#8B5A2B"
    - state: tip
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: MedievalSoundOnInteract
    onPick:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_pickup1.ogg
      params:
        variation: 0.2
    onPut:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_put1.ogg
      params:
        variation: 0.2

- type: entity
  id: MedievalSteelNormalArrow
  parent: BasePoiseArrow
  name: steel arrow
  components:
  - type: Sprite
    layers:
    - state: tail
      color: white
    - state: rod
      color: "#8B5A2B"
    - state: tip
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: MedievalSoundOnInteract
    onPick:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_pickup1.ogg
      params:
        variation: 0.2
    onPut:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_put1.ogg
      params:
        variation: 0.2
  - type: PoiseArchery
    damageType: Piercing
    fixedDamage: 8
    damageMultiplier: 1
    bluntMultiplier: 0.6
    maxPoiseMultiplier: 1.2

