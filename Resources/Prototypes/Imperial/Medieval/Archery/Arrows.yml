# Needle AP arrows
- type: entity
  id: MedievalArrowNeedle
  parent: BasePoiseArrow
  name: needle arrow
  description: A narrow steel-tipped arrow designed to pierce armor.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Gun/arrow_needle.rsi
    layers:
    - state: tail
      color: gray
    - state: rod
      color: "#8B5A2B"
    - state: tip
      color: silver
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Imperial/Medieval/Gun/arrow_needle.rsi
  - type: APDamageOnHit
    damage:
      types:
        Piercing: 8
  - type: PoiseArchery
    damageType: Piercing
    fixedDamage: 2
    damageMultiplier: 0.2
    bluntMultiplier: 0.1
    minPoiseMultiplier: 0.3
    maxPoiseMultiplier: 0.3
  - type: MedievalSoundOnInteract
    onPick:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_pickup1.ogg
      params:
        variation: 0.2
    onPut:
      path: /Audio/Imperial/Medieval/Items/Arrows/arrow_put1.ogg
      params:
        variation: 0.2

