- type: entity
  parent: BaseActionBookTargetAbility
  id: ActionBookTaming
  name: Договор с хищником
  description: Держите корм и выберите ослабленного зверя в пределах 6 клеток без преград между вами. Приручение занимает 30 секунд и расходует корм при успехе. Нажатие движения, прямое попадание атаки, потеря корма или дистанции прервут его. Яд и кровопотеря его не прерывают. Можно иметь одного живого спутника.
  components:
  - type: Action
    useDelay: 60
    icon:
      sprite: Imperial/Medieval/Interface/Actions/book_abilities.rsi
      state: taming
  - type: TargetAction
    range: 6
  - type: EntityTargetAction
    event: !type:BookTamingActionEvent

