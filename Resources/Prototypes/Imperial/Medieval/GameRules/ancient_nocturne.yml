- type: entity
  parent: MobHuman
  id: MedievalHellfireInquisitionKnight
  categories: [ HideSpawnMenu ]
  components:
  - type: HellfireInquisitionMember
  - type: Loadout
    prototypes: [ RPGMedievalFlame ]
  - type: OneHandedLargeSlashSkill

- type: entity
  parent: MobHuman
  id: MedievalHellfireInquisitionLeader
