    layers:
    - state: green
    - state: cburn

- type: entity
  parent: MarkerBase
  id: MedievalHellfireInquisitionChaplainGhostRoleSpawner
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: ghost-role-information-hellfire-inquisition-chaplain-name
    description: ghost-role-information-hellfire-inquisition-chaplain-description
    rules: ghost-role-information-hellfire-inquisition-rules
    raffle:
