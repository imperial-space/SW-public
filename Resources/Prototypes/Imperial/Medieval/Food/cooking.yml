- type: Tag
  id: MedievalBowl

- type: entity
  parent: FoodBowlBase
  id: MedievalFoodMess
  name: poor stew
  description: Whatever was in the pot, boiled together. It fills the belly and little else.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Food/bowls.rsi
    layers:
    - state: bowl
    - state: mess-4
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: mess-
    changeColor: false
    inHandsFillBaseName: -mess-
    inHandsMaxFillLevels: 2
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: bowl-inhand-left
      right:
      - state: bowl-inhand-right
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Water
          Quantity: 4

- type: entity
  parent: FoodBowlBase
  id: MedievalFoodBurntMess
  name: burnt mess
  description: Burnt black and stuck together. Eating this is a bad idea.
  components:
  - type: FlavorProfile
    flavors:
    - terrible
  - type: Sprite
    sprite: Imperial/Medieval/Food/bowls.rsi
    layers:
    - state: bowl
    - state: burnt-4
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: burnt-
    changeColor: false
    inHandsFillBaseName: -burnt-
    inHandsMaxFillLevels: 2
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: bowl-inhand-left
      right:
      - state: bowl-inhand-right
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 8
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: GastroToxin
          Quantity: 6

