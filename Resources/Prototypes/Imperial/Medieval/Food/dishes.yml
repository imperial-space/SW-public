- type: entity
  abstract: true
  parent: DrinkBase
  id: MedievalJugBase
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Food/Dishes/jug.rsi
    layers:
    - state: jug
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 60
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: fill-
    inHandsMaxFillLevels: 0
    inHandsFillBaseName: null
  - type: Item
    size: Normal
  - type: Damageable
    damageContainer: Inorganic

- type: entity
  abstract: true
  parent: MedievalJugBase
  id: MedievalJugBreakable
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          MedievalJugTrash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

