- type: entity
  parent: FoodMeatRawBase
  id: MedievalFoodSausage
  name: raw sausage
  description: A raw sausage. Better cooked before eating.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: sausage-inhand-left
      right:
      - state: sausage-inhand-right
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Sprite
    sprite: Imperial/Medieval/Food/meat.rsi
    state: sausage
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
        - ReagentId: Fat
          Quantity: 5

- type: entity
  parent: FoodMeatBase
  id: MedievalFoodSausageCooked
  name: fried sausage
  description: A sausage fried until golden brown.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Item
    inhandVisuals:
      left:
      - state: sausage-cooked-inhand-left
      right:
      - state: sausage-cooked-inhand-right
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Sprite
    sprite: Imperial/Medieval/Food/meat.rsi
    state: sausage-cooked
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 5

- type: entity
