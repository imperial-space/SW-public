- type: entity
  id: RevenantBossGate
  localizationId: Revenant_Boss_Gate
  placement:
    mode: AlignTileAny
  components:
  - type: Godmode
  - type: BossArenaProtected
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/Medieval/Structures/BossArenaGate/gate.rsi
    noRot: false

    drawdepth: HighFloorObjects
    offset: 0, 0.6875
    layers:
    - state: closed
      map: ["enum.BossArenaGateVisuals.Layer"]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      gate:
        shape: !type:PhysShapeAabb

          bounds: "-0.9,0.55,0.9,1.45"
        hard: true
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BossArenaGateVisuals.Open:
        enum.BossArenaGateVisuals.Layer:
          True: {state: open}
          False: {state: closed}
  - type: BossArenaGate
    arenaId: revenant
    messagePrefix: Revenant_Boss_
    arenaMapPath: /Maps/Imperial/Medieval/revenant-arena.yml
  - type: BossArenaGateEffects
    flameLight: RevenantBossGateFlameLight
    coneLight: RevenantBossGateConeLight
    openingEffect: RevenantBossGateOpeningEffect

- type: entity
  id: RevenantBossGateFlameLight
  localizationId: Revenant_Boss_Gate_Flame_Light
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#bb62ff"
    radius: 2.5
    energy: 1.3
    softness: 2
    castShadows: true
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  id: RevenantBossGateConeLight
  localizationId: Revenant_Boss_Gate_Cone_Light
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    enabled: false
    color: "#a44bff"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6
    energy: 3
    softness: 2
    castShadows: true
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  id: RevenantBossGateOpeningEffect
  localizationId: Revenant_Boss_Gate_Opening_Effect
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/boost.rsi
    color: "#c480ff"
    noRot: false
    drawdepth: Effects
    scale: 2, 1
    layers:
    - state: beginner
      shader: unshaded
  - type: PointLight
    color: "#c480ff"
    radius: 3.5
    energy: 2
    castShadows: true
  - type: TimedDespawn
    lifetime: 0.5
  - type: Tag
    tags: [ HideContextMenu ]
