- type: bossTelegraphStyle
  id: VeyrathConstellationStyle
  warningOverflowTiles: 1
  warningAreaOutline: true
  dangerColor: '#FF862F'
  sentencingColor: '#FFFFFF'
  markerSize: 0.85, 0.85
  markerOffset: 0, 0.1
  safeColor: '#57EAB8'
  blueColor: '#4DBDFF'
  purpleColor: '#BC66FF'
  tankColor: '#48DEFF'
  tankMarkerOffset: 0, 0.05
  tankMarkerSize: 0.35, 0.35
  tankTextureContentSize: 38, 38
  tankTexture: /Textures/Imperial/Medieval/Mobs/Bosses/RevenantBoss/tank_overlay_icon.png
  tankBusterColor: '#FF4026'
  tankBusterBobDistance: 0.5
  tankBusterMarkerSize: 0.5, 0.5
  spreadColor: '#FF668D'
  spreadHighlightColor: '#00000000'
  spreadMarkerOffset: 0, 0.1
  stackColor: '#F7D968'
  stackHighlightColor: '#00000000'
  constellationBeam:
    sprite: /Textures/Imperial/Medieval/Effects/Boss/flame_beam.rsi
    anchorPixels: 30, 32
    coreLengthPixels: 196
    pixelsPerTile: 16
- type: entity
  id: VeyrathConstellationMechanic
  categories: [HideSpawnMenu]
  components:
  - type: BossMechanicDefinition
    encounter: veyrath
    feature: Constellation
    style: VeyrathConstellationStyle
    patterns:
    - BlueFirst
    - PurpleFirst
    blueEmitterPrototype: RevenantBossBlueFlameEmitter
    purpleEmitterPrototype: RevenantBossPurpleFlameEmitter
- type: entity
  parent: RevenantBossConstellationFlameEmitter
  id: RevenantBossBlueFlameEmitter
  localizationId: Revenant_Boss_Blue_Emitter
  components:
  - type: Sprite
    layers:
    - state: blue
      shader: unshaded
  - type: PointLight
    color: '#4DBDFF'
- type: entity
  parent: RevenantBossConstellationFlameEmitter
  id: RevenantBossPurpleFlameEmitter
  localizationId: Revenant_Boss_Purple_Emitter
  components:
  - type: Sprite
    layers:
    - state: purple
      shader: unshaded
  - type: PointLight
    color: '#BC66FF'

- type: entity
  id: RevenantBossConstellationFlameEmitter
  localizationId: Revenant_Boss_Constellation_Emitter
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: BossArenaProtected
  - type: SyncSprite
  - type: Sprite
    sprite: Imperial/Medieval/Structures/RevenantBossConstellation/flame.rsi
    noRot: true
    drawdepth: SmallObjects
    scale: 0.5, 0.5
    offset: 0, 0.2
    layers:
    - state: blue
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 1
    castShadows: false
