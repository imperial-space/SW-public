- type: entity
  id: RevenantBossTelegraph
  localizationId: Revenant_Boss_Telegraph
  components:
  - type: BossTelegraph

- type: entity
  id: RevenantBossImpact
  localizationId: Revenant_Boss_Impact
  components:
  - type: BossTelegraph
  - type: TimedDespawn
    lifetime: 0.4

- type: entity
  id: RevenantBossTileHitEffect
  localizationId: Revenant_Boss_Impact
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/nova.rsi
    color: "#B84ADB"
    noRot: true
    offset: 0,0.5
    layers:
    - state: beginner
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  id: RevenantBossBrazier
  localizationId: Revenant_Boss_Brazier
  components:
  - type: Godmode
  - type: BossArenaProtected
  - type: BossBrazierAnimation
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/Medieval/Structures/RevenantBossBrazier/brazier.rsi
    noRot: true
    drawdepth: SmallObjects
    scale: 0.5, 0.5
    offset: 0, 0.5
    layers:
    - state: off
      map: ["empty"]
    - state: white
      visible: false
      shader: unshaded
      map: ["white"]
    - state: purple
      visible: false
      shader: unshaded
      map: ["purple"]
    - state: lit
      visible: false
      shader: unshaded
      map: ["victory"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BossBrazierVisuals.State:
        empty:
          Empty: {visible: true}
          White: {visible: false}
          Purple: {visible: false}
          Victory: {visible: false}
        white:
          Empty: {visible: false}
          White: {visible: true}
          Purple: {visible: false}
          Victory: {visible: false}
        purple:
          Empty: {visible: false}
          White: {visible: false}
          Purple: {visible: true}
          Victory: {visible: false}
        victory:
          Empty: {visible: false}
          White: {visible: false}
          Purple: {visible: false}
          Victory: {visible: true}
  - type: PointLight
    enabled: false
    radius: 4
    energy: 3
    color: "#BB45FF"

- type: entity
  id: RevenantBossTankMarker
  localizationId: Revenant_Boss_Tank_Marker
  components:
  - type: BossActorMarker
    kind: Tank

- type: entity
  id: RevenantBossTankBusterMarker
  localizationId: Revenant_Boss_Tank_Buster_Marker
  components:
  - type: BossActorMarker
    kind: TankBuster

- type: entity
  id: RevenantBossConstellationFlameEmitter
  localizationId: Revenant_Boss_Constellation_Emitter
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: BossArenaProtected
  - type: SyncSprite
  - type: Sprite
    sprite: Imperial/Medieval/Structures/RevenantBossConstellation/flame.rsi
    noRot: true
    drawdepth: SmallObjects
    scale: 0.5, 0.5
    offset: 0, 0.2
    layers:
    - state: blue
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 1
    castShadows: false

- type: entity
  parent: RevenantBossConstellationFlameEmitter
  id: RevenantBossBlueFlameEmitter
  localizationId: Revenant_Boss_Blue_Emitter
  components:
  - type: Sprite
    layers:
    - state: blue
      shader: unshaded
  - type: PointLight
    color: "#4DBDFF"

- type: entity
  parent: RevenantBossConstellationFlameEmitter
  id: RevenantBossPurpleFlameEmitter
  localizationId: Revenant_Boss_Purple_Emitter
  components:
  - type: Sprite
    layers:
    - state: purple
      shader: unshaded
  - type: PointLight
    color: "#BC66FF"

- type: entity
  id: RevenantBossSpreadMarker
  localizationId: Revenant_Boss_Spread_Marker
  components:
  - type: BossActorMarker
    kind: Spread

- type: entity
  id: RevenantBossStackMarker
  localizationId: Revenant_Boss_Stack_Marker
  components:
  - type: BossActorMarker
    kind: Stack

- type: entity
  id: RevenantBossAutoFlame
  components:
  - type: BossAutoProjectile
    flight:
      sprite: Imperial/Medieval/Mobs/Bosses/RevenantBoss/auto_flame.rsi
      state: flight
    charge:
      sprite: Imperial/Medieval/Mobs/Bosses/RevenantBoss/auto_flame.rsi
      state: charge
    trail:
      sprite: Imperial/Medieval/Mobs/Bosses/RevenantBoss/auto_flame.rsi
      state: trail
    impact:
      sprite: Imperial/Medieval/Mobs/Bosses/RevenantBoss/auto_flame.rsi
      state: impact
    scale: 0.5
    anchorPixels: 120, 80
    speed: 10
    handOffset: 0, 0.5
