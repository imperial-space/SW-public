- type: entity
  id: RevenantBoss
  localizationId: Revenant_Boss
  placement:
    mode: AlignTileAny
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Mobs/Bosses/RevenantBoss/revenant_boss.rsi
    noRot: true
    drawdepth: Mobs
    scale: 1, 1
    offset: 0, 0.5
    layers:
    - state: idle
      map: ["enum.BossStageVisuals.Layer"]
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 1.1
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BossStageVisuals.Stage:
        enum.BossStageVisuals.Layer:
          1: {state: idle}
  - type: Clickable
  - type: InteractionOutline
  - type: LanguageSpeaker
    currentLanguage: Universal
    languages:
      Universal: Speak
  - type: UniversalLanguageSpeaker
  - type: Damageable
  - type: MeleeWeapon
    hidden: true
    damage:
      types: {ParryAble: 1}
  - type: BossArenaProtected
  - type: BossArenaAttackSource
  - type: BossTelegraphSettings
    fixedCardinals: true
    captionPrefix: Revenant_Boss_
    telegraphPrototype: RevenantBossTelegraph
    tankMarkerPrototype: RevenantBossTankMarker
    tankBusterMarkerPrototype: RevenantBossTankBusterMarker
    spreadMarkerPrototype: RevenantBossSpreadMarker
    stackMarkerPrototype: RevenantBossStackMarker
    impactPrototype: RevenantBossImpact
    tileImpactPrototype: RevenantBossTileHitEffect
    blueEmitterPrototype: RevenantBossBlueFlameEmitter
    purpleEmitterPrototype: RevenantBossPurpleFlameEmitter
    style: RevenantBossTelegraphStyle
    slashSound: /Audio/Imperial/Medieval/RevenantBoss/slash.ogg
    tankBusterImpactSound: /Audio/Imperial/Medieval/RevenantBoss/execution_fall.ogg
    tankBusterImpactSoundVolume: -6
    executionLine: true
    executionLineWidth: 3
    autoProjectilePrototype: RevenantBossAutoFlame
    magicImpactSound: /Audio/Imperial/Medieval/RevenantBoss/magic_hit.ogg
    crystalImpactSound: null
  - type: BossMusic
    soundtrack: destination
  - type: BossPresentation
    castEffect:
      sprite: Imperial/Medieval/SpellCastEffects/darkness/tentacles.rsi
      state: beginner
    preparedCastEffect:
      sprite: Imperial/Medieval/SpellCastEffects/MultiCurrency/wave.rsi
      state: beginner
    castEffectScale: 3
    castEffectColor: "#B277FF"
    preparedCastEffectColor: "#CAEEF0"

  - type: PointLight
    color: "#9292FF"
    radius: 14
    energy: 3
    falloff: 1
    castShadows: false
  - type: BossEncounter
    autoStart: false
    tankDamage:
      types: {Heat: 18}
    damage:
      buster:
        types: {Slash: 500, ParryAble: 1}
      cleave:
        types: {Slash: 60}
      vigil:
        types: {Slash: 80, Cold: 40}
      embrace:
        types: {Slash: 35, Cold: 35}
      cross:
        types: {Cold: 70}
      sentence:
        types: {Slash: 100}
      communion:
        types: {Cold: 100}
      cone:
        types: {Heat: 60}
      constellation:
        types: {Heat: 40}
      crystalRain:
        types: {Piercing: 60}
    patternDamage:
      Stack: communion
      CardinalCone: cone
    tutorial:
    - {pattern: Sinistra}
    - {pattern: Dextra}
    - {tankBuster: true, castTime: 5}
    - {pattern: Frons}
    - {pattern: Tergum}
    - {combo: true, queue: [Sinistra, Sinistra]}
    - {traversal: StepCleave}
    - {pattern: Cross, damage: cross}
    - {pattern: Divide, damage: cross}
    - {pattern: Spread, castTime: 4, damage: sentence}
    - {pattern: Stack, castTime: 4, damage: sentence}
    - {pattern: Rejection, castTime: 4, damage: embrace}
    - {pattern: Invitation, castTime: 4, damage: embrace}
    - {traversal: EdgeCone}
    - {traversal: CrystalRain, damage: crystalRain, rainCount: 64, rainWarningTime: 3, rainSizes: [3, 2], rainCastTime: 1.5, rainConcurrent: 16, rainMaxConcurrent: 30, rainSpawnInterval: 0.5, rainMinSpawnInterval: 0.15, rainDoubleChance: 0.5, rainRampSeconds: 60}
    - {pattern: BlackoutNorthWest, randomCorner: true, castTime: 6, damage: vigil}
    - {pattern: PurpleFirst, castTime: 4, followupDelay: 4, sequentialConstellation: true, damage: constellation}
    rotation:
    - {tankBuster: true, castTime: 5}
    - {combo: true}
    - {pattern: Rejection, alternate: Invitation, castTime: 4, damage: embrace}
    - {traversal: StepCleave}
    - {pattern: Spread, alternate: Stack, castTime: 4, damage: sentence}
    - {pattern: Cross, alternate: Divide, damage: cross}
    - {traversal: StepCross, damage: cross}
    - {traversal: EdgeCone}
    - {combo: true}
    - {pattern: BlackoutNorthWest, randomCorner: true, castTime: 6, damage: vigil}
    - {traversal: CrystalRain, damage: crystalRain, rainCount: 96, rainWarningTime: 3, rainSizes: [3, 2, 2], rainCastTime: 1.5, rainConcurrent: 16, rainMaxConcurrent: 30, rainSpawnInterval: 0.5, rainMinSpawnInterval: 0.15, rainDoubleChance: 0.5, rainRampSeconds: 60}
    - {pattern: PurpleFirst, castTime: 4, followupDelay: 2, damage: constellation}

    escalation:
    - {tankBuster: true, castTime: 5}
    - {mixedSentence: true}
    - {pattern: Rejection, alternate: Invitation, castTime: 4, damage: embrace}
    - {traversal: EdgeCone, coneSpread: true}
    - {traversal: StepCleave}
    - {vigilFollowup: Cross, alternate: Divide, castTime: 6}
    - {pattern: PurpleFirst, castTime: 4, followupDelay: 2, damage: constellation}
    - {traversal: StepCross, damage: cross}
    - {mixedSentence: true, stackFirst: true}
    - {traversal: EdgeCone, coneFlank: true}
    - {traversal: CrystalRain, damage: crystalRain, rainCount: 128, rainWarningTime: 3, rainSizes: [3, 2, 3, 2], rainCastTime: 1.5, rainConcurrent: 16, rainMaxConcurrent: 30, rainSpawnInterval: 0.5, rainMinSpawnInterval: 0.15, rainDoubleChance: 0.5, rainRampSeconds: 60}
    - {vigilFollowup: Divide, alternate: Cross, castTime: 6}
    - {pattern: Cross, alternate: Divide, crossSentence: true, castTime: 3, damage: cross}
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: BossHealthBar
    showOverhead: true
    color: "#BF1429"
    size: 96, 8
    offset: 0, 132
  - type: BossCastBar
    size: 48, 3
    offset: 24, 122
    borderWidth: 0.5
    backgroundColor: "#00000000"
  - type: BossHealthScaling
    maxHealth: 40000
    maxPlayers: 8
    arenaRadius: 20
  - type: DoAfter
  - type: StatusEffects
    allowed:
    - Jitter
  - type: Boss
    health: 20000
    useDamageableHealth: true
    teleportPlayers: false
    isEndGame: false
    sendBackDelay: 0
    defeatMessage: ""
    loseMessage: ""

    componentsOnDefeat:
    - type: SpawnOnDespawn
      prototype: RevenantBossCoffer
    - type: TimedDespawn
      lifetime: 2
    stages:
      1:
        threshold: 20000
        stageDelay: 3
        attacks:
        - !type:BossPreparedSequenceAttack
          preloadTime: 5
          releaseTime: 7
          strikeInterval: 4
          warningLeadTime: 2
          releaseName: Revenant_Boss_Requiem
          cooldown: 8
          lengthWeights: {2: 30, 3: 40, 4: 30}

          damage:
            types:
              Slash: 60
          recipes:
          - strikes: [Sinistra, Dextra]
          - strikes: [Sinistra, Sinistra]
          - strikes: [Sinistra, Dextra, Sinistra]
          - strikes: [Sinistra, Sinistra, Dextra]
          - strikes: [Sinistra, Frons, Dextra]
          - strikes: [Sinistra, Dextra, Sinistra, Dextra]
          - strikes: [Sinistra, Sinistra, Dextra, Dextra]
          - strikes: [Sinistra, Dextra, Dextra, Sinistra]
          - strikes: [Sinistra, Frons, Dextra, Tergum]
