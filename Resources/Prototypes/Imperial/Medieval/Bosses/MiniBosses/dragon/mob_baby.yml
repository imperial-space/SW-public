- type: speechSounds
  id: MedievalSmallDragon
  saySound:
    path: /Audio/Imperial/Medieval/smalldragon.ogg
  askSound:
    path: /Audio/Imperial/Medieval/smalldragon.ogg
  exclaimSound:
    path: /Audio/Imperial/Medieval/smalldragon.ogg

- type: entity
  name: dragon
  abstract: true
  parent: SimpleMobBaseNoFood
  id: MedievalBabyBossBaseDragon
  description: small dragon
  components:
    - type: ForcedSleepImmune
    - type: Hands
      hands:
        hand_left:
          location: left
      sortedHands:
        - hand_left
      showInHands: false
      emptyRepresentative: []
    - type: MedievalSpellCaster
    - type: Mana
      maxMana: 100
      regen: 4
    - type: AddActionOnSpawn
      actions:
        - MedievalActionBlinkDragon
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Blunt
          damage: 100000
        behaviors:
        - !type:GoSSDBehavior { }
        - !type:GibBehavior { }
    - type: Flammable
      firestackFade: -1
      canResistFire: true
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.8
          density: 50
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: LocalLight
      energy: 1
      radius: 5
    - type: PointLight
      netsync: false
      enabled: false
    - type: DamageStateVisuals
      states:
        Alive:
          Base: alive
        Dead:
          Base: dead
    - type: MobThresholds
      thresholds:
        0: Alive
        380: Dead
    - type: SlowOnDamage
      speedModifierThresholds:
        90: 0.9
        150: 0.8
        300: 0.7
    - type: Tag
      tags:
      - FootstepSound
    - type: Bloodstream
      bloodMaxVolume: 0
    - type: Appearance
    - type: NpcFactionMember
      factions:
      - Xeno
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
    - type: LanguageSpeaker
      languages:
        Common: Speak
        Goblin: Speak
        Ancient: Speak
        Tribe: Speak
        Orc: Speak
        Cursed: Speak
        Growling: Speak
        Hissing: Speak
        Elf: Speak
    - type: MeleeWeapon
      hidden: true
      angle: 0
      animation: WeaponArcPunch
      soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
      damage:
        groups:
          Brute: 48
        types:
          Structural: 600
      range: 2.5
      attackRate: 0.5
    - type: StaminaDamageOnHit
      damage: 70
    - type: Stamina
      critThreshold: 1000
    - type: MedievalUnthrowable
    - type: MeleeThrowOnHit
      distance: 7
      speed: 12
    - type: FootstepModifier
      footstepSoundCollection:
        path: /Audio/Effects/Footsteps/hardbarefoot1.ogg
    - type: NoSlip
    - type: Speech
      speechVerb: LargeMob
      speechSounds: MedievalSmallDragon
    - type: MovementSpeedModifier
      baseWalkSpeed: 4
      baseSprintSpeed: 2.8
    - type: GhostTakeoverAvailable
    - type: GhostRole
      makeSentient: true
      name: ghost-role-information-dragon-name
      description: ghost-role-information-dragon-description
      rules: ghost-role-information-dragon-rules
      mindRoles:
      - MindRoleGhostRoleSoloAntagonist
      raffle:
        settings: short
    - type: Devourer
      foodPreferenceWhitelist:
        components:
        - HumanoidAppearance
      stomachStorageWhitelist:
        components:
        - MobState
      chemical: Ichor
      healRate: 5
      whitelist:
        components:
        - MobState
        #- Door
        #tags:
        #- Wall

- type: entity
  name: dragon
  parent: MedievalBabyBossBaseDragon
  id: MedievalBabyBossIceDragon
  description: small dragon
  components:
    - type: Sprite
      drawdepth: Mobs
      layers:
      - map: ["enum.DamageStateVisualLayers.Base"]
        state: alive
      sprite: Imperial/Medieval/Mobs/Bosses/Dragons/babyice.rsi
    - type: HitscanBatteryAmmoProvider
      proto: MedievalProjectileWaterSphereSmallDragon
      fireCost: 1
    - type: Battery
      maxCharge: 10000
      startingCharge: 10000
    - type: Gun
      projectileSpeed: 8
      fireRate: 1.3
      useKey: false
      selectedMode: SemiAuto
      availableModes:
      - SemiAuto
      soundGunshot: /Audio/Imperial/Medieval/icebeam_shot.ogg
    - type: Butcherable
      spawned:
      - id: MedievalDragonLootIcescale
        amount: 2
      - id: MedievalDragonLootBones
        amount: 1
      - id: FoodMeat
        amount: 3
      - id: MedievalLeather1
        amount: 1
      - id: MedievalDragonLootTrueWaterEssence
        amount: 1

