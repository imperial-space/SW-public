- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceRatling
  categories: [ HideSpawnMenu ]
  name: ratling appearance
  components:
  - type: InitialBody
    organs:
      Head: OrganRatlingHead
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Torso: OrganRatlingTorso
      Lungs: OrganHumanLungs
      Heart: OrganRatlingHeart
      Stomach: OrganRatlingStomach
      Liver: OrganRatlingLiver
      Kidneys: OrganHumanKidneys
      ArmLeft: OrganRatlingArmLeft
      ArmRight: OrganRatlingArmRight
      HandLeft: OrganRatlingHandLeft
      HandRight: OrganRatlingHandRight
      LegLeft: OrganRatlingLegLeft
      LegRight: OrganRatlingLegRight
      FootLeft: OrganRatlingFootLeft
      FootRight: OrganRatlingFootRight
  - type: HumanoidProfile
    species: Ratling

- type: entity
  id: OrganRatlingHeart
  parent: OrganHumanHeart
  name: Ratling heart
  components:
  - type: Metabolizer
    metabolizerTypes: [Ratling, Human]

- type: entity
  id: OrganRatlingLiver
  parent: OrganHumanLiver
  name: Ratling liver
  components:
  - type: Metabolizer
    metabolizerTypes: [Ratling, Human]

- type: entity
  id: OrganRatlingStomach
  parent: OrganHumanStomach
  name: Ratling stomach
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [Ratling, Human, Animal]

- type: metabolizerType
  id: Ratling
  name: Ratling

- type: entity
  save: false
  name: Urist McRatling
  parent: BaseMobRatling
  id: MobRatling

- type: entity
  save: false
  name: Urist McHands The Ratling
  parent: [AppearanceRatling, BaseSpeciesMobOrganic]
  id: BaseMobRatling
  abstract: true
  components:
  - type: CanSmellFood
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.7
    damageRecovery:
      types:
        Asphyxiation: -1.3
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: FootstepModifier
    footstepSoundCollection: null
  - type: LanguageSpeaker
    languages:
      Common: Speak
      Goblin: Speak
  - type: Mana
    maxManaRaceModifier: 1
    regenRaceModifier: 1
  - type: Inventory
    templateId: ratling
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Imperial/Medieval/Species/displacement.rsi
            state: jumpsuit-female
  - type: MobThresholds
    thresholds:
      0: Alive
      95: Critical
      190: Dead
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: NeedSleep
    sleepLevelPerUpdate: 0.36
  - type: BadSmell
    isDirtyVisible: false
  - type: BadSmellRaceModifier
    modifier: 100
  - type: Damageable
    damageModifierSet: Ratling
  - type: PointLight
    netsync: false
    enabled: false
  - type: LocalLight
    energy: 0.2
    radius: 4.2
  - type: TypingIndicator
    proto: wolf
  - type: Bloodstream
    bloodReagent: RatlingBlood
  - type: Puller
    needsHands: false
  - type: HumanoidProfile
    species: Ratling
  - type: BadSmellVision
    smellThreshold: 80.0
    radius: 8
  - type: Speech
    speechSounds: Alto
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: RatlingAccent
  - type: StealRaceChanceIncreaser
    bonus: 25

- type: damageModifierSet
  id: Ratling
  coefficients:
    Heat: 1.2

- type: entity
  parent: AppearanceRatling
