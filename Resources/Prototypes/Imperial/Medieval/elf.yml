      limit: 1
      required: false
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceElf
  categories: [ HideSpawnMenu ]
  name: elf appearance
  components:
  - type: InitialBody
    organs:
      Head: OrganElfHead
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Torso: OrganElfTorso
      Lungs: OrganHumanLungs
      Heart: OrganElfHeart
      Stomach: OrganElfStomach
      Liver: OrganElfLiver
      Kidneys: OrganHumanKidneys
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandLeft: OrganHumanHandLeft
      HandRight: OrganHumanHandRight
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
  - type: HumanoidProfile
    species: Elf

# Blood

- type: reagent
  id: ElvishBlood
  parent: Blood
  name: reagent-name-elvish-blood
  slipData: null
  desc: reagent-desc-elvish-blood
  evaporationSpeed: 0.3
  absorbent: true
  physicalDesc: reagent-physical-desc-elvish-blood
  color: "#0072a7"
  flavor: elvishblood

- type: flavor
  id: elvishblood
  flavorType: Complex
  description: flavor-complex-elvish-blood

- type: entity
  parent: OrganBase
  id: OrganElf
  abstract: true
  suffix: elf

- type: entity
  parent: OrganElf
  id: OrganElfExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Elf

- type: entity
  parent: OrganElf
  id: OrganElfInternal
  abstract: true


- type: entity
  id: OrganElfTorso
  name: "Elf torso"
  parent: [OrganBaseTorsoSexed, OrganBaseTorso, OrganElfExternal]
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: ElvishBlood
        Quantity: 20

- type: entity
  id: OrganElfHead
  name: "Elf head"
  parent: [OrganBaseHeadSexed, OrganBaseHead, OrganElfExternal]
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: ElvishBlood
        Quantity: 10
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

- type: entity
  id: OrganElfHeart
  parent: OrganHumanHeart
  name: Elf heart
  components:
  - type: Metabolizer
    metabolizerTypes: [Elf]

- type: entity
  id: OrganElfLiver
  parent: OrganHumanLiver
  name: Elf liver
  components:
  - type: Metabolizer
    metabolizerTypes: [Elf]

- type: entity
  id: OrganElfStomach
  parent: OrganHumanStomach
  name: Elf stomach
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    # mm very yummy
    maxReagents: 5
    metabolizerTypes: [Elf]

- type: metabolizerType
  id: Elf
  name: elf

- type: entity
  save: false
  name: Urist McForestElf
  parent: BaseMobElf
  id: MobElf

- type: entity
  save: false
  name: Urist McHands The Elf
  parent: [AppearanceElf, BaseSpeciesMobOrganic]
  id: BaseMobElf
  abstract: true
  components:
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi # It was like this beforehand, no idea why.
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.35
    damageRecovery:
      types:
        Asphyxiation: -0.85
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 0.97, 1.03
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 6
  - type: LanguageSpeaker
    languages:
      Common: Speak
      #Goblin: Speak
      #Ancient: Speak
      #Tribe: Speak
      #Orc: Speak
      #Cursed: Speak
      #Growling: Speak
      #Hissing: Speak
      Elf: Speak
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.37
        # they r smaller
        density: 150
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
      medieval-spawner: # imperial medieval start
        shape: !type:PhysShapeCircle
          radius: 0.4
        layer: []
        #layer:
        #- DoorPassable
        mask:
        - MedievalSpawnerLayer
        hard: false # imperial medieval end
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: Speech
    speechSounds: Alto
  - type: HumanoidProfile
    species: Elf
  - type: Mana
    maxManaRaceModifier: 1.12
    regenRaceModifier: 1.12
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Bloodstream
    bloodReagent: ElvishBlood

- type: entity
  parent: AppearanceElf
  id: MobElfDummy
  noSpawn: true
  components:
  - type: Sprite
    scale: 0.97, 1.03
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female

