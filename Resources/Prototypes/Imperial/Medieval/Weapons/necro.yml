- type: entity
  name: MedievalDaggerNecro
  parent: [ BaseKnife, BaseDaggerCharged, BasePoiseSlashSmall ]
  id: MedievalDaggerNecro
  description: A deadly knife intended for melee confrontations.
  components:
  - type: AdvancedLightAttack
    preset: Dagger
  # dedicated thrown hit poise, distinct from melee poise
  - type: PoiseImpact
    poiseDamage: 10
  - type: ThrownWeaponPoiseReset
  # throwing damage balance
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 12
        Cold: 1
        Caustic: 1
  - type: QuestItem
    contractName: "любые кинжалы"
  - type: Sprite
    sprite: Imperial/Medieval/Melee/necro_dagger.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Medieval/Melee/necro_dagger.rsi
  - type: MeleeParry
  - type: MeleeWeapon
    clickDamageModifier: 1
    attackRate: 1.34
    range: 1
    damage:
      types:
        Slash: 2.66
        Caustic: 1.33
        ParryAble: 1
        Blunt: 0
        Piercing: 2.66
        Heat: 0
        Shock: 0
        Cold: 1.33
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0
        Structural: 0
    resetOnHandSelected: false
    soundHit:
      path: /Audio/Imperial/Medieval/ES_Knife_Stab_2_-_SFX_Producer.ogg
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: true
    cPAnimationOffset: 0.8
    #wideAnimationRotation: -150
  - type: RadiationSource
    intensity: 1
    slope: 1
  - type: EmbeddableProjectile
    offset: 0.15,0.15
  - type: ThrowingAngle
    angle: 225
  - type: Tag
    tags:
    - Spear
  - type: MeleeThrowOnHit
    distance: 0.3
    speed: 5
  - type: StaminaDamageOnHit
    damage: 1 #2 dagger, 5 spear, 4 sword, 5 mace, 8 halberd, 6 sekir, 18 hammer
  - type: Meltable
    resourceCount: 2
  - type: PoiseDamage
    poiseDamage: 2
  - type: MedievalWeaponSkillCategory
    skill: OneHandedSlashSmall
  - type: APDamageOnHit
    damage:
      types:
        Blunt: 0
        Slash: 1.5
        Piercing: 1
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0

