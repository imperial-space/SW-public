- type: entity
  name: iron halberd
  parent: [ BaseItem, BaseTwoHandedCharged, BasePoiseTwoHanded ]
  id: MedievalIronHalberdT3
  description: A medieval poleaxe.
  components:
  - type: AdvancedLightAttack
    preset: Halberd
  - type: PoiseDamage
    poiseDamage: 15
  - type: RDWeight
    value: 7
  - type: QuestItem
    contractName: "любое двуручное оружие"
  - type: EmitSoundOnLand
    sound:
      collection: MedievalIronDrop
      params:
          variation: 0.02
          volume: 1
  - type: Tag
    tags:
    - FireAxe
  - type: Sharp
  - type: Sprite
    sprite: Imperial/Medieval/Melee/halberd.rsi
    state: icon
  - type: Clothing
    sprite: Imperial/Medieval/Melee/halberd.rsi
    slots:
    - back
    - suitStorage
  - type: MeleeParry
  - type: MeleeWeapon
    angle: 150
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: false
    cPAnimationOffset: 1
    clickDamageModifier: 1
    wideAnimationRotation: -140
    attackRate: 0.55
    range: 2.1
    damage:
      types:
        Piercing: 10.8
        Slash: 10.8
        Structural: 10
        ParryAble: 1
        Blunt: 0
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MedievalMeleeResource
    resourceWaste: 0.8
    safeToHitGroup: structure
  - type: Wieldable
    useDelayOnWield: false
    #wieldTime: 3
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 4.05
        Structural: 0
        Piercing: 6.75
        Slash: 0
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0
  - type: Item
    size: Huge
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 12
  #- type: EmbeddableProjectile
    #offset: 0.15,0.15
  - type: MeleeRequiresWield
  #- type: QualityOfItem
  #  qualityWeights:
  #    0: 0
  #    1: 0
  #    2: 0
  #    3: 10
  #    4: 0
  #    5: 0
  #    6: 0
  - type: MeleeThrowOnHit
    distance: 1.5
    speed: 5
  - type: StaminaDamageOnHit
    damage: 4 #2 dagger, 5 spear, 4 sword, 5 mace, 8 halberd, 6 sekir, 18 hammer
  - type: Meltable
    resourceCount: 7
  - type: HeldSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: MedievalWeaponSkillCategory
    skill: TwoHanded
  - type: APDamageOnHit
    damage:
      types:
        Blunt: 0
        Slash: 0
        Piercing: 0
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0

