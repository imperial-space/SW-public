- type: entity
  name: dagger
  parent:  MedievalDaggerT3
  id: MedievalDaggerCult
  description: A deadly knife intended for melee confrontations.
  components:
  - type: AdvancedLightAttack
    preset: Dagger
  # dedicated thrown hit poise, distinct from melee poise
  - type: PoiseImpact
    poiseDamage: 10
  - type: ThrownWeaponPoiseReset
  - type: CultRitualMelee
  - type: Sprite
    sprite: Imperial/Medieval/Melee/dagger_cult.rsi
    size: Small
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Medieval/Melee/dagger_cult.rsi
  - type: MeleeParry
  - type: MeleeWeapon
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: true
    cPAnimationOffset: 1
    clickDamageModifier: 1
    attackRate: 1.34
    range: 1
    damage:
      types:
        Slash: 2.66
        ParryAble: 1
        Blunt: 0
        Piercing: 2.66
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 1.33
        Radiation: 1.33
        Holy: 0
        Bloodloss: 0
        Structural: 0
    soundHit:
      path: /Audio/Imperial/Medieval/ES_Knife_Stab_2_-_SFX_Producer.ogg
    resetOnHandSelected: false
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 12
        Poison: 1
        Radiation: 1
  #- type: EmbeddableProjectile
    #offset: 0.15,0.15
  - type: ThrowingAngle
    angle: 225
  - type: Tag
    tags:
    - Spear
    - Knife
  - type: MeleeThrowOnHit
    distance: 0.3
    speed: 5
  - type: StaminaDamageOnHit
    damage: 6
  - type: CurseItem
    cult: true
  - type: PoiseDamage
    poiseDamage: 2
  - type: MedievalWeaponSkillCategory
    skill: OneHandedSlashSmall
  - type: APDamageOnHit
    damage:
      types:
        Blunt: 0
        Slash: 1.5
        Piercing: 1
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0

