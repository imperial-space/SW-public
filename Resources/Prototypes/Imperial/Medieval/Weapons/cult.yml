    damage:
      types:
        Blunt: 0
        Slash: 0
        Piercing: 3
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0

