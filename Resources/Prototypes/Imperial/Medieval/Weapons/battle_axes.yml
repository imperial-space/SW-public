    quickEquip: false
    equipSound:
      path: /Audio/Imperial/Medieval/sword_uneqip.ogg
    unequipSound:
      path: /Audio/Imperial/Medieval/sword_eqip.ogg
  - type: DisarmMalus
  - type: DamageOtherOnHit
    damage:
      types:
