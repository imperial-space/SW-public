    state: icon
  - type: MeleeParry
  - type: MeleeWeapon
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: false
    cPAnimationOffset: 1
    clickDamageModifier: 1.15
    wideAnimationRotation: -140
    attackRate: 1.15
    damage:
      types:
        Slash: 22.5
        ParryAble: 1
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    soundSwing:
      path: /Audio/Imperial/Medieval/sword_swing.ogg
  - type: MedievalMeleeResource
    resourceWaste: 0.35
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Imperial/Medieval/Melee/iron_sword_legion.rsi
    slots:
