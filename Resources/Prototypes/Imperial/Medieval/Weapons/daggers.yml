- type: entity
  name: dagger
  parent: [ BaseKnife, BaseDaggerCharged, BasePoiseSlashSmall ]
  id: MedievalDaggerT3
  description: A deadly knife intended for melee confrontations.
  components:
  - type: AdvancedLightAttack
    preset: Dagger
  # dedicated thrown hit poise, distinct from melee poise
  - type: PoiseImpact
    poiseDamage: 10
  - type: ThrownWeaponPoiseReset
  - type: QuestItem
    contractName: "любые кинжалы"
  - type: Sprite
    sprite: Imperial/Medieval/Melee/dagger.rsi
    size: Small
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Medieval/Melee/dagger.rsi
  - type: MeleeParry
  - type: MeleeWeapon
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: true
    cPAnimationOffset: 0.8
    clickDamageModifier: 1
    resetOnHandSelected: false
    attackRate: 1.34
    range: 1
    damage:
      types:
        Slash: 3.325
        ParryAble: 1
        Blunt: 0
        Piercing: 3.325
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0
        Structural: 0
    soundHit:
      path: /Audio/Imperial/Medieval/ES_Knife_Stab_2_-_SFX_Producer.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 13
  #- type: QualityOfItem
  #  qualityWeights:
  #    0: 0
  #    1: 0
  #    2: 0
  #    3: 10
  #    4: 0
  #    5: 0
  #    6: 0
  - type: EmbeddableProjectile
    offset: 0.15,0.15
  - type: ThrowingAngle
    angle: 225
  - type: Tag
    tags:
    - Spear
    - Knife
  - type: Clothing
    sprite: Imperial/Medieval/Melee/dagger.rsi
    slots:
    - belt
    quickEquip: false
  - type: MeleeThrowOnHit
    distance: 0.3
    speed: 5
  - type: StaminaDamageOnHit
    damage: 1 #2 dagger, 5 spear, 4 sword, 5 mace, 8 halberd, 6 sekir, 18 hammer
  - type: Meltable
    resourceCount: 1
  - type: PoiseDamage
    poiseDamage: 2
  - type: MedievalWeaponSkillCategory
    skill: OneHandedSlashSmall
  - type: APDamageOnHit
    damage:
      types:
        Blunt: 0
        Slash: 2
        Piercing: 1
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0

