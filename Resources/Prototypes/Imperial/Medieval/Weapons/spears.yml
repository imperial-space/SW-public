- type: entity
  name: bone spear
  parent:
  - BaseItem
  - BaseSpearCharged
  - BasePoiseSpear
  id: SpearBone
  description: A spear made of bones.
  components:
  - type: AdvancedLightAttack
    preset: Spear
  - type: PoiseImpact
    poiseDamage: 12
  - type: ThrownWeaponPoiseReset
  - type: PoiseDamage
    poiseDamage: 7
  - type: Spear
  - type: RDWeight
    value: 4
  - type: Sprite
    sprite: Objects/Weapons/Melee/bone_spear.rsi
    layers:
    - state: spear
    - state: spear1
      map:
      - "enum.SolutionContainerLayers.Fill"
      visible: false
  - type: Construction
    node: spear
    graph: SpearBone
  - type: Sharp
  - type: MeleeWeapon
    wideAnimationRotation: -140
    attackRate: 0.8
    range: 2.15
    damage:
      types:
        Piercing: 7.2
        Blunt: 0
        Slash: 0
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0
        Structural: 0
    angle: 0
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: false
    cPAnimationOffset: 1.8
    clickDamageModifier: 1
    #animation: WeaponArcThrust
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Wieldable
    useDelayOnWield: false
    #wieldTime: 0.5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 6
        Blunt: 0
        Slash: 0
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0
        Structural: 0
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 12
  - type: EmbeddableProjectile
    offset: 0.15,0.15
  - type: ThrowingAngle
    angle: 225
  - type: Tag
    tags:
    - Spear
  - type: LandAtCursor
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.30
          - -0.30,-0.40
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: MeleeThrowOnHit
    distance: 0.5
    speed: 5
  - type: MedievalWeaponSkillCategory
    skill: Spear
  - type: APDamageOnHit
    damage:
      types:
        Blunt: 0
        Slash: 0
        Piercing: 2
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
        Poison: 0
        Radiation: 0
        Holy: 0
        Bloodloss: 0

