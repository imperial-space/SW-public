- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceLamian
  categories: [ HideSpawnMenu ]
  name: lamian appearance
  components:
  - type: InitialBody
    organs:
      Head: OrganLamianHead
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Torso: OrganLamianTorso
      Lungs: OrganHumanLungs
      Heart: OrganLamianHeart
      Stomach: OrganLamianStomach
      Liver: OrganLamianLiver
      Kidneys: OrganHumanKidneys
      ArmLeft: OrganLamianArmLeft
      ArmRight: OrganLamianArmRight
      HandLeft: OrganLamianHandLeft
      HandRight: OrganLamianHandRight
      LegLeft: OrganLamianLegLeft
      LegRight: OrganLamianLegRight
      FootLeft: OrganLamianFootLeft
      FootRight: OrganLamianFootRight
  - type: HumanoidProfile
    species: Lamian

- type: entity
  id: OrganLamianHeart
  parent: OrganHumanHeart
  name: Lamian heart
  components:
  - type: Metabolizer
    metabolizerTypes: [Lamian]

- type: entity
  id: OrganLamianLiver
  parent: OrganHumanLiver
  name: Lamian liver
  components:
  - type: Metabolizer
    metabolizerTypes: [Lamian]

- type: entity
  id: OrganLamianStomach
  parent: OrganHumanStomach
  name: Lamian stomach
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    # mm very yummy
    maxReagents: 5
    metabolizerTypes: [Lamian]

- type: metabolizerType
  id: Lamian
  name: Lamian

- type: entity
  save: false
  name: Urist McLamian
  parent: BaseMobLamian
  id: MobLamian
  categories: []

- type: entity
  save: false
  name: Urist McHands The Lamian
  parent: [AppearanceLamian, BaseSpeciesMobOrganic]
  id: BaseMobLamian
  abstract: true
  components:
  - type: Hunger
    baseDecayRate: 0.0096
  - type: Thirst
    baseDecayRate: 0.15
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi # It was like this beforehand, no idea why.
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1
    damageRecovery:
      types:
        Asphyxiation: -1
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: LanguageSpeaker
    languages:
      Common: Speak
      Hissing: Speak
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        # they r smaller
        density: 150
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
      medieval-spawner: # imperial medieval start
        shape: !type:PhysShapeCircle
          radius: 0.4
        layer: []
        #layer:
        #- DoorPassable
        mask:
        - MedievalSpawnerLayer
        hard: false # imperial medieval end
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: Speech
    speechSounds: Alto
  - type: HumanoidProfile
    species: Lamian
  - type: Mana
    maxManaRaceModifier: 1.1
    regenRaceModifier: 1.1
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Imperial/Medieval/Species/Lamian/displacement.rsi
            state: jumpsuit-female
  - type: MobThresholds
    thresholds:
      0: Alive
      90: Critical
      180: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.4
    baseSprintSpeed: 3.4
  - type: MeleeWeapon
    attackRate: 0.8
    damage:
      types:
        Blunt: 5
  - type: NeedSleep
    sleepLevelPerUpdate: 0.35
  - type: BadSmellRaceModifier
    modifier: 1.25
  - type: Tag
    tags:
    - Lamian
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
  - type: Damageable
    damageModifierSet: Lamian
  - type: Wagging
  - type: Bloodstream
    bloodReagent: LamianBlood
  - type: DrowningModifier
    resistanceModifier: 1.5

- type: damageModifierSet
  id: Lamian
  coefficients:
    Heat: 1.15
    Poison: 0.5

- type: entity
  parent: AppearanceLamian
  id: MobLamianDummy
  noSpawn: true
