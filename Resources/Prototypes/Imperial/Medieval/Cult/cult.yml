- type: entity
  parent: ClothingOuterBase
  id: MedievalClothingOuterArmorCult
  name: leather armor
  description: An armored vest with fur plates to protect against melee weapons.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Clothing/Armor/cult_armor.rsi
  - type: Clothing
    equipDelay: 1.4
    unequipDelay: 1.4
    sprite: Imperial/Medieval/Clothing/Armor/cult_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.75
        Piercing: 0.7
        Heat: 0.75
        Cold: 0.45
  - type: MedievalArmorIntegrity
    containerArmorHP: 170
    repairType: Sewing
    unbrokenExplosionResistance:
      damageCoefficient: 0.15
    brokenExplosionResistance:
      damageCoefficient: 0.85
    unbrokenResistances:
      Blunt:
        coefficient: 0.15
      Slash:
        coefficient: 0.125
      Piercing:
        coefficient: 0.275
      Heat:
        coefficient: 0.2
    brokenResistances:
      Blunt:
        coefficient: 0.9
      Slash:
        coefficient: 0.9
      Piercing:
        coefficient: 0.9
      Heat:
        coefficient: 0.9
    breakageMultipliers:
      Piercing: 1
      Blunt: 0.8
      Slash: 1.25
      Heat: 1
    breakSound:
      path: /Audio/Imperial/Medieval/Armor/integrity_break_leather.ogg
      params:
        variation: 0.2
  - type: StaminaResistance
    damageCoefficient: 0.7
  - type: Item
    size: Normal
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: CultClothing
  - type: CurseItem
    cult: true

