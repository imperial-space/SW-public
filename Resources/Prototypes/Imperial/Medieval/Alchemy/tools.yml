      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseMedievalAlchemyApparatus
  id: MedievalAlchemyFilter
  name: alchemy apparatus
  description: A station for filtering alchemical mixtures.
  components:
  - type: Sprite
