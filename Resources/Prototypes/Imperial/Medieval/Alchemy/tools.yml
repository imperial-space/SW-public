- type: entity
  parent: BaseMedievalAlchemyApparatus
  id: MedievalAlchemyInfuse
  name: alchemy apparatus
  description: A station for preparing alchemical infusions.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/infusion.rsi
    state: icon
  - type: AlchemyApparatus
    operation: Infuse
    outputToInput: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
