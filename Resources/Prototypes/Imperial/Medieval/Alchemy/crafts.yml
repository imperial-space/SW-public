- type: CP14Recipe
  id: MedievalAlchemyWhiskCraft
  craftTime: 2
  stacks:
    WoodPlank: 5
    MedievalIronIngot: 1
  result: MedievalAlchemyWhiskCraft

- type: CP14Recipe
  id: MedievalAlchemyCoolCraft
  craftTime: 4
  stacks:
    MedievalCoal: 2
    MedievalIronPlateSmall: 4
