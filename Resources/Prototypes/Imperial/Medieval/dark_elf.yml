- type: markingsGroup
  parent: Undergarments
  id: DarkElf
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDarkElf
  categories: [ HideSpawnMenu ]
  name: darkelf appearance
  components:
  - type: InitialBody
    organs:
      Head: OrganDarkElfHead
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Torso: OrganDarkElfTorso
      Lungs: OrganHumanLungs
      Heart: OrganDarkElfHeart
      Stomach: OrganDarkElfStomach
      Liver: OrganDarkElfLiver
      Kidneys: OrganHumanKidneys
      ArmLeft: OrganDarkElfArmLeft
      ArmRight: OrganDarkElfArmRight
      HandLeft: OrganDarkElfHandLeft
      HandRight: OrganDarkElfHandRight
      LegLeft: OrganDarkElfLegLeft
      LegRight: OrganDarkElfLegRight
      FootLeft: OrganDarkElfFootLeft
      FootRight: OrganDarkElfFootRight
  - type: HumanoidProfile
    species: DarkElf

- type: entity
  id: OrganDarkElfHeart
  parent: OrganHumanHeart
  name: DarkElf heart
  components:
  - type: Metabolizer
    metabolizerTypes: [DarkElf]

- type: entity
  id: OrganDarkElfLiver
  parent: OrganHumanLiver
  name: DarkElf liver
  components:
  - type: Metabolizer
    metabolizerTypes: [DarkElf]

- type: entity
  id: OrganDarkElfStomach
  parent: OrganHumanStomach
  name: DarkElf stomach
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    # mm very yummy
    maxReagents: 5
    metabolizerTypes: [DarkElf]

- type: metabolizerType
  id: DarkElf
  name: DarkElf

- type: entity
  save: false
  name: Urist McDarkElf
  parent: BaseMobDarkElf
  id: MobDarkElf

- type: entity
  save: false
  name: Urist McHands The DarkElf
  parent: [AppearanceDarkElf, BaseSpeciesMobOrganic]
  id: BaseMobDarkElf
  abstract: true
  components:
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: Imperial/Medieval/Species/Slime/parts.rsi # It was like this beforehand, no idea why.
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.7
    damageRecovery:
      types:
        Asphyxiation: -0.7
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 0.97, 1.03
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        # they r smaller
        density: 150
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
      medieval-spawner: # imperial medieval start
        shape: !type:PhysShapeCircle
          radius: 0.4
        #layer:
        #- DoorPassable
        mask:
        - MedievalSpawnerLayer
        hard: false # imperial medieval end
  - type: LanguageSpeaker
    languages:
      Common: Speak
      #Goblin: Speak
      Ancient: Understand
      #Tribe: Speak
      #Orc: Speak
      #Cursed: Speak
      #Growling: Speak
      #Hissing: Speak
      Elf: Speak
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: Speech
    speechSounds: Alto
  - type: HumanoidProfile
    species: DarkElf
  - type: Mana
    maxManaRaceModifier: 1.25
    regenRaceModifier: 1.25
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Imperial/Medieval/Species/DarkElf/displacement.rsi
            state: jumpsuit-female
  - type: MobThresholds
    thresholds:
      0: Alive
      105: Critical
      180: Dead
  - type: NeedSleep
    sleepLevelPerUpdate: 0.21
  - type: PointLight
    netsync: false
    enabled: false
  - type: LocalLight
    energy: 0.2
    radius: 2.8
  - type: Bloodstream
    bloodReagent: DarkElvishBlood

- type: entity
  parent: AppearanceDarkElf
  id: MobDarkElfDummy
  noSpawn: true
  components:
  - type: Sprite
    scale: 0.97, 1.03
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Imperial/Medieval/Species/DarkElf/displacement.rsi
            state: jumpsuit-female
  - type: MobThresholds
    thresholds:
      0: Alive
      105: Critical
      180: Dead
  - type: Mana
    maxManaRaceModifier: 1.5
    regenRaceModifier: 1.5
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.7
    damageRecovery:
      types:
        Asphyxiation: -0.7


- type: species
  id: DarkElf
  name: species-name-dark-elf
  roundStart: true
  prototype: MobDarkElf
  dollPrototype: AppearanceDarkElf
  skinColoration: DarkElfColors

