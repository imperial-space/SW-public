# Impact

- type: entity
  id: LightningImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/MultiCurrency/Lightning/impact.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: impact
      shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2.5
    color: "#A5C2F3"
  - type: TimedDespawn
    lifetime: 0.32
