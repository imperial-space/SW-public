  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/MultiCurrency/lightning.rsi
    color: "#CFE0FF"
    noRot: true
    layers:
      - state: middle
        shader: unshaded
  - type: PointLight
