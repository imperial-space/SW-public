- type: entity
  id: IceBarrierParticles
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/MultiCurrency/WeakeningWave/icons.rsi
    state: senior
  - type: MedievalParticles
    color: "#39FFFF"
  - type: TimedDespawn
    lifetime: 5
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Imperial/Medieval/icewall_down.ogg

#Beginner

- type: entity
  id: IceBarrierSpellCastEffectBeginner
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/vodka/barrier.rsi
    color: "#78C6ED"
    noRot: true
    layers:
      - state: beginner
        shader: unshaded
  - type: PointLight
    radius: 2
    energy: 2
    color: "#78C6ED"
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  id: IceBarrierFrostEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.3
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Imperial/Medieval/Magic/Vodka/IceBarrier/frost.rsi
      state: frost
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
