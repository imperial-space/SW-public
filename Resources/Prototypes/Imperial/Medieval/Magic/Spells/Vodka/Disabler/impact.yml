# Hit flash for the disabler spell

- type: entity
  id: DisablerImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.3
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Imperial/Medieval/Magic/Vodka/Disabler/impact.rsi
      state: impact
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu

- type: entity
  id: DisablerImpactEffectBig
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.3
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Imperial/Medieval/Magic/Vodka/Disabler/impact_big.rsi
      state: impact
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
