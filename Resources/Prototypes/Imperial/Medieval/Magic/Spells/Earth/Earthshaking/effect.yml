- type: entity
  id: EarthshakingSpellCastEffectBeginner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/earth/earthshaking.rsi
    color: "#838275"
    noRot: true
    layers:
      - state: beginner
        shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2
    color: "#838275"
  - type: TimedDespawn
    lifetime: 1

