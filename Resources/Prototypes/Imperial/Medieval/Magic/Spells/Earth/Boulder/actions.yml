# Beginner

- type: entity
  id: MedievalActionBoulderBeginner
  name: medieval-store-spells-earth-boulder-beginner-name
  description: medieval-store-spells-earth-boulder-beginner-desc
  components:
  - type: CastTraining
    trainingResults:
      - !type:AddMagicEssence
        essenceAddProbability: 0.0007
        bonusAddProbability: 1
        addedEssences:
          MagicMedievalEarth: 1
        bonusEssences:
          MagicMedievalEarth: 1
  - type: ManaDrainSpell
    manaDrain: 40
    canUseWithoutMana: true
    manaLowMessage: medieval-spell-speach-not-enough-mana-fire-spell
    damageOnUseWithoutMana:
      groups:
        Burn: 12
  - type: SpellCastEffect
    effectProto: BoulderSpellCastEffect
  - type: MedievalTargetSpell
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/Medieval/mob_spawn_effect.ogg
    icon:
      sprite: Imperial/Medieval/Magic/Earth/Boulder/icons.rsi
      state: beginner
  - type: TargetAction
    checkCanAccess: false
    targetingIndicator: false
    range: 60
  - type: WorldTargetAction
    event: !type:MedievalSpawnAimingEntityEvent
      spawnedEntity: MedievalBoulderEmerge
      speechPoints:
        0:
          speech: medieval-spell-speach-boulder
          color: "#838275"
          hideChat: true
  - type: MedievalTargetOverlayOnAiming
    maxTargetCount: 1
    whiteListComponents:
      - type: Damageable
  - type: ActionUpgrade
    effectedLevels:
      2: MedievalActionBoulderMiddle
      3: MedievalActionBoulderSenior

