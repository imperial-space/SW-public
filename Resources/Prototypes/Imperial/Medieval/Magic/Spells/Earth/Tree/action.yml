# Beginner

- type: entity
  id: MedievalActionSeedlingsBeginner
  name: medieval-store-spells-earth-seedlings-beginner-name
  description: medieval-store-spells-earth-seedlings-beginner-desc
  components:
  - type: ManaDrainSpell
    manaDrain: 20
    canUseWithoutMana: false
    manaLowMessage: medieval-spell-speach-not-enough-mana-fire-spell
    damageOnUseWithoutMana:
      groups:
        Burn: 12
  - type: SpellCastEffect
    effectProto: SeedlingsSpellCastEffectBeginner
  - type: MedievalTargetSpell
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/Medieval/mob_spawn_effect.ogg
    icon:
      sprite: Imperial/Medieval/Magic/Earth/Tree/icons.rsi
      state: beginner
  - type: TargetAction
    checkCanAccess: false
    range: 8
  - type: WorldTargetAction
    event: !type:MedievalSpawnSpellEvent
      spawnedEntityPrototype: MedievalSeedlingsBeginner
      spawnType: SpawnOnMousePosition
      spellCastDoAfter:
        delay: 3
        breakOnDropItem: false
        breakOnWeightlessMove: false
        breakOnMove: false
        needHand: true
        speedModifier: 0.3
      speechPoints:
        0:
          speech: medieval-spell-speach-seedlings
          color: "#AB8C00"
          hideChat: true
  - type: ActionUpgrade
    effectedLevels:
      2: MedievalActionSeedlingsMiddle
      3: MedievalActionSeedlingsSenior

