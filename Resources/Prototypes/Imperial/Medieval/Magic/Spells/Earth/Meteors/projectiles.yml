# Spot

- type: entity
  id: MedievalMeteorSpot
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 100
        mask:
          - FullTileMask
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Earth/Meteors/projectiles.rsi
    noRot: true
    layers:
    - state: meteor-spot
      shader: unshaded
  - type: DelayedSpawn
    proto: MedievalMeteor
    delay: 4.5
  - type: TimedDespawn
    lifetime: 5


# Meteor

- type: entity
  id: MedievalMeteor
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Earth/Meteors/fall.rsi
    noRot: true
    offset: -1.125,2.0
    layers:
    - state: meteor
      shader: unshaded
  - type: TimedDespawn
    lifetime: 1.5
  - type: SpawnOnDespawn
    prototype: MedievalExplodeMeteor

- type: entity
  id: MedievalExplodeMeteor
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Meteor
    maxIntensity: 2
    intensitySlope: 5
    totalIntensity: 10
    canCreateVacuum: false
  - type: SpawnOnTrigger
    proto: ShockWaveEffect
  - type: SpawnEntityOnTrigger
    spawnedEntitiesPrototype:
    - MedievalMeteorImpact

- type: entity
  id: MedievalMeteorImpact
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Earth/Meteors/impact.rsi
    noRot: true
    offset: 0,0.2
    layers:
    - state: scorch
      drawdepth: Puddles
    - state: impact
      shader: unshaded
  - type: TimedDespawn
    lifetime: 6.5

- type: explosion
  id: Meteor
  damagePerIntensity:
    types:
      Blunt: 3
      Piercing: 3
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  fireColor: "#ff9a3c"

# Beginner

- type: entity
  id: MedievalMeteorsBeginner
  components:
  - type: TriggerOnSpawn
  - type: RandomOffsetSpawn
    spawnedEntityID: MedievalMeteorSpot
    radius: 1
    quantity: 2
  - type: TimedDespawn
    lifetime: 1

# Middle

- type: entity
  id: MedievalMeteorsMiddle
  components:
  - type: TriggerOnSpawn
  - type: RandomOffsetSpawn
    spawnedEntityID: MedievalMeteorSpot
    radius: 1
    quantity: 4
  - type: TimedDespawn
    lifetime: 1

# Senior

- type: entity
  id: MedievalMeteorsSenior
  components:
  - type: TriggerOnSpawn
  - type: RandomOffsetSpawn
    spawnedEntityID: MedievalMeteorSpot
    radius: 2
    quantity: 8
  - type: TimedDespawn
    lifetime: 1


