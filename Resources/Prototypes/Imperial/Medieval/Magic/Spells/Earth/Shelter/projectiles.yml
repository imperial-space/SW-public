- type: entity
  id: MedievalShelterSenior
  components:
  - type: TriggerOnSpawn
  - type: VectoredSpawnOnTrigger
    spawnedEntityID: MedievalShelterRock
    spawnPositions: ["-1, 2", "0, 2", "1, 2", "2, 1", "2, 0", "2, -1", "-1, -2", "0, -2", "1, -2", "-2, 1", "-2, 0", "-2, -1"]
  - type: TimedDespawn
    lifetime: 1

- type: entity
  id: MedievalShelterRock
  parent: MedievalWallRock
  components:
  - type: TriggerOnSpawn
  - type: SpawnEntityOnTrigger
    spawnedEntitiesPrototype:
    - MedievalRockDust
  - type: TimedDespawn
    lifetime: 9
  - type: SpawnOnDespawn
    prototype: MedievalRockDust
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:SpawnEntitiesBehavior
            offset: 0
            spawn:
              MedievalRockDust:
                min: 1
                max: 1
          - !type:PlaySoundBehavior
            sound:
              path: /Audio/Effects/break_stone.ogg
              params:
                volume: -6
