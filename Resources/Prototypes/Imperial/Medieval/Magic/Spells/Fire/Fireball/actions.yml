# Beginner

- type: entity
  id: MedievalActionFireballBeginner
  name: medieval-store-spells-fire-fireball-beginner-name
  description: medieval-store-spells-fire-fireball-beginner-desc
  components:
  - type: MedievalTargetSpell
  - type: Action
    useDelay: 180
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/Medieval/fireball_cast.ogg
    icon:
      sprite: Imperial/Medieval/Magic/Fire/Fireball/icons.rsi
      state: beginner
  - type: TargetAction
    checkCanAccess: false
    range: 60
    targetingIndicator: false
  - type: WorldTargetAction
    event: !type:MedievalProjectileSpellEvent
      projectilePrototype:
        0: MedievalProjectileFireballBeginner
      faceTargetWhileCasting: true
      spawnForwardOffset: 0.9
      spellCastDoAfter:
        delay: 3
        breakOnDropItem: false
        breakOnWeightlessMove: false
        breakOnMove: false
        needHand: true
        speedModifier: 0
      speechPoints:
        0:
          speech: medieval-spell-speach-fireball
          color: "#FF5900"
          hideChat: true
  - type: SpellCastEffect
    effectProto: FireballSpellCastEffectBeginner
    forwardEffectProto: FireballChargeEffectBeginner
    forwardEffectOffset: 0.9
  - type: ShowSpawnedEntity
    sprites:
      - drawedSprite:
          sprite: Imperial/Medieval/Magic/Fire/Fireball/pointer.rsi
          state: pointer
        alwaysRender: true
        mixColor: 0
        opacity: 1
        inRangeColor: "#ff8a1f"
  - type: ManaDrainSpell
    manaDrain: 70
    canUseWithoutMana: true
    manaLowMessage: medieval-spell-speach-not-enough-mana-fire-spell
    damageOnUseWithoutMana:
      groups:
        Burn: 27
  - type: CastTraining
    trainingResults:
      - !type:AddMagicEssence
        essenceAddProbability: 0.0001
        bonusAddProbability: 1
        addedEssences:
          MagicMedievalFire: 1
        bonusEssences:
          MagicMedievalFire: 1
  - type: DamageTraining
    trainingResults:
      - !type:AddMagicEssence
        probability: 0.0001
        conditions:
          - !type:TargetContainsComponentsCondition
            componentsWhitelist:
              - type: TrainingTarget
        addedEssences:
          MagicMedievalFire1: 2
      - !type:AddMagicEssence
        probability: 0.0001
        conditions:
          - !type:TargetContainsComponentsCondition
            componentsWhitelist:
              - type: MobState
          - !type:MagicTargetMobStateCondition
            allowedState: Alive
        addedEssences:
          MagicMedievalFire1: 3
  - type: ActionUpgrade
    effectedLevels:
      2: MedievalActionFireballMiddle
      3: MedievalActionFireballSenior

