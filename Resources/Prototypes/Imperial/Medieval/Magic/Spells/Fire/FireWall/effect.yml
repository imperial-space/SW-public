#Beginner

- type: entity
  id: FireWallSpellCastEffectBeginner
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/wall.rsi
    color: "#ff9c24"
    noRot: true
    layers:
      - state: beginner
        shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2
    color: "#ff9c24"
  - type: TimedDespawn
    lifetime: 2.5

#Middle

- type: entity
  id: FireWallSpellCastEffectMiddle
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/wall.rsi
    color: "#ff9c24"
    noRot: true
    layers:
      - state: middle
        shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2
    color: "#ff9c24"
  - type: TimedDespawn
    lifetime: 3.0

#Senior

- type: entity
  id: FireWallSpellCastEffectSenior
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/wall.rsi
    color: "#ff9c24"
    noRot: true
    layers:
      - state: senior
        shader: unshaded
  - type: PointLight
    radius: 3
    energy: 3
    color: "#ff9c24"
  - type: TimedDespawn
    lifetime: 4

# Fade (when the wall burns out)

- type: entity
  id: FireWallFadeBeginner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/FireWall/fade.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: beginner
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  id: FireWallFadeMiddle
  parent: FireWallFadeBeginner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: middle
      shader: unshaded

- type: entity
  id: FireWallFadeSenior
  parent: FireWallFadeBeginner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: senior
      shader: unshaded
