# Middle

- type: entity
  id: MedievalProjectileConcentratedDisplacementMiddle
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/CriticalMass/cells.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: displacement_t2
      shader: unshaded
  - type: PointLight
    radius: 1.8
    energy: 0.6
    color: "#655b9c"
  - type: RepeatingTrigger
    delay: 1.2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 4
    intensitySlope: 1
    totalIntensity: 5
    canCreateVacuum: false

