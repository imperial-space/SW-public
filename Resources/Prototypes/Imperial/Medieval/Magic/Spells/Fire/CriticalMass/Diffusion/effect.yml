# Middle

- type: entity
  id: MedievalEffectDiffusionMiddle
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/CriticalMass/effects.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: diffusion_t2
      shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 0.8
    color: "#80508a"
  - type: Physics
  - type: Fixtures
  - type: Brarrier
    spawnedEntity: MedievalProjectileDiffusionMiddle
    barrierLength: 5
    lookupRadius: 0.45
    barrierSpawnTime: 0.3
    permissibleIntersectionsPercentage: 0.3
    spawnRelativePosition: 1,1
  - type: TimedDespawn
    lifetime: 1.2

- type: entity
  id: DiffusionSpellCastEffectMiddle
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/nova.rsi
    color: "#FF0062"
    noRot: true
    layers:
      - state: beginner
        shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2
    color: "#FF0062"
  - type: TimedDespawn
    lifetime: 0.5

