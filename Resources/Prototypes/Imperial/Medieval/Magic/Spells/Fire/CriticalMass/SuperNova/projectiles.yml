# Middle

- type: entity
  id: MedievalEffectCriticalMassMiddle
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/CriticalMass/effects.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: supermass_t2
      shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 0.8
    color: "#6f86b4"
  - type: RepeatingTrigger
    delay: 2.2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 5
    intensitySlope: 6
    totalIntensity: 6
    canCreateVacuum: false

