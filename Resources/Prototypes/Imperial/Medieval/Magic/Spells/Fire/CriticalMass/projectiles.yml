- type: entity
  id: MedievalEffectCriticalMassBeginner
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/CriticalMass/effects.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: supermass_t1
      shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 0.8
    color: "#655b9c"
  - type: RepeatingTrigger
    delay: 1.2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 1
    intensitySlope: 2
    totalIntensity: 5
    canCreateVacuum: false
