# Middle

- type: entity
  id: MedievalProjectileDiffusionMiddle
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/CriticalMass/cells.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: diffusion_t2
      shader: unshaded
  - type: PointLight
    radius: 1.8
    energy: 0.6
    color: "#80508a"
  - type: RepeatingTrigger
    delay: 1.2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 1
    intensitySlope: 1
    totalIntensity: 3
    canCreateVacuum: false

