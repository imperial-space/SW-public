# Middle

- type: entity
  id: MedievalEffectConcentratedDisplacementMiddle
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/CriticalMass/effects.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: displacement_t2
      shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 0.8
    color: "#655b9c"
  - type: Physics
  - type: Fixtures
  - type: Brarrier
    spawnedEntity: MedievalProjectileConcentratedDisplacementMiddle
    barrierLength: 5
    lookupRadius: 0.45
    barrierSpawnTime: 0.3
    permissibleIntersectionsPercentage: 0.3
    spawnRelativePosition: 1,1
    onlyOneSide: true
  - type: TimedDespawn
    lifetime: 1.2

- type: entity
  id: ConcentratedDisplacementSpellCastEffectMiddle
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/nova.rsi
    color: "#764ADB"
    noRot: true
    layers:
      - state: beginner
        shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2
    color: "#764ADB"
  - type: TimedDespawn
    lifetime: 0.5

