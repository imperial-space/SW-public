- type: entity
  id: FlashWaveEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: ShockWave
    speed: 0.95
    effects:
    - !type:ImperialFlashReactionEffect
      maxRange: 1
      maxDuration: 3
      slowTo: 0.5
      slowOnlyTarget: true
  - type: ShockWaveDistortion
    speed: 1
    thikness: 0.001
    distortion: 2
    maxDistance: 0.25
    disappearDistancePercentage: 0.0
  - type: TimedDespawn
    lifetime: 0.4
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Imperial/Medieval/flashbang_blast.ogg
      params:
        variation: 0.2

#Beginner

- type: entity
  id: FlashSpellCastEffectBeginner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/light/flash.rsi
    color: "#FFE57E"
    noRot: true
    layers:
      - state: beginner
        shader: unshaded
  - type: PointLight
    radius: 2
    energy: 1
    color: "#FFE57E"
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  id: FlashBurstEffectBeginner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Light/Flash/burst.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: beginner
      shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2.5
    color: "#FFE57E"
  - type: TimedDespawn
    lifetime: 0.32

- type: entity
  id: FlashBurstEffectMiddle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Light/Flash/burst.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: middle
      shader: unshaded
  - type: PointLight
    radius: 3.5
    energy: 3
    color: "#FFE57E"
  - type: TimedDespawn
    lifetime: 0.32
