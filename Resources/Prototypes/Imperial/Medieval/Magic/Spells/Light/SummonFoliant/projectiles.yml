# Beginner

- type: entity
  id: MedievalProjectileSummonFoliantBeginner
  categories: [ HideSpawnMenu ]
  components:
    - type: CargoSellBlacklist
    - type: Sprite
      sprite: Imperial/Medieval/Magic/Light/SummonFoliant/flash.rsi
      drawdepth: Effects
      noRot: true
      layers:
      - state: flash
        shader: unshaded
    - type: PointLight
      color: white
      energy: 2
      radius: 2
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.35
          density: 15
          mask:
          - GhostImpassable
    - type: TimedDespawn
      lifetime: 0.5
    - type: FoliantToHandTeleporter
