# Beginner

- type: entity
  id: DivineTouchBeginner
  parent: BaseItem
  name: Health Touch
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Melee/hand.rsi
    state: poison
  - type: Unremoveable
  - type: MedievalMeleeResource
    resource: 1
    maxResource: 1
    resourceWaste: 1
    effectSoundOnBreak: /Audio/Imperial/Medieval/heal_cast.ogg
    effectSoundOnRepair: /Audio/Imperial/Medieval/heal_cast.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 0
    clickDamageModifier: 0.5
    animation: WeaponArcThrust
    attackRate: 1
    angle: 0
    damage:
      types:
        Blunt: -6.67
        Slash: -6.67
        Piercing: -6.66
        Heat: -6.67
        Shock: -6.67
        Cold: -6.66
        Asphyxiation: -10
        Bloodloss: -20
        Poison: -10
        Radiation: -10
        Cellular: -10
    resistanceBypass: true
    soundHit:
      path: /Audio/Imperial/Medieval/heal_cast.ogg
  - type: MedievalSpellOnInteract
    soundOnInteract:
      path: /Audio/Imperial/Medieval/heal_cast.ogg
    effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: -6.67
            Slash: -6.67
            Piercing: -6.66
            Heat: -6.67
            Shock: -6.67
            Cold: -6.66
            Asphyxiation: -10
            Bloodloss: -20
            Poison: -10
            Radiation: -10
            Cellular: -10
    selfUseEffects:
      - !type:HealthChange
        damage:
          types:
            Blunt: -3.33
            Slash: -3.33
            Piercing: -3.34
            Heat: -3.33
            Shock: -3.33
            Cold: -3.34
            Asphyxiation: -5
            Bloodloss: -10
            Poison: -5
            Radiation: -5
            Cellular: -5

