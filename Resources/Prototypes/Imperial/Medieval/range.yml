# Crossbows

- type: entity
  name: crossbow
  parent: BaseWeaponSniper
  id: MedievalWeaponCrossbow
  suffix: Medieval
  description: A portable anti-armour rifle. Fires armor piercing 14.5mm shells. Uses .60 anti-material ammo.
  components:
  # projectile damage and poise scaling
  - type: MedievalCrossbowShotModifier
    damageMultiplier: 1.5
    poiseMultiplier: 1
  - type: RDWeight
    value: 5
  - type: Sprite
    sprite: Imperial/Medieval/Gun/crossbow.rsi
  - type: Clothing
    sprite: Imperial/Medieval/Gun/crossbow.rsi
  - type: BallisticAmmoProvider
    cartridgeFillDelay: 3
    whitelist:
      tags:
      - Bolt
    capacity: 1
    proto: MedievalBolt
    autoCycle: true
    soundInsert:
      path: /Audio/Imperial/Medieval/ES_Crossbow_Fire_10_-_SFX_Producer.ogg
  - type: Gun
    defaultSpread: 10
    resetOnHandSelected: false
    fireRate: 0.25
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Imperial/Medieval/ES_Arrow_Release_1_-_SFX_Producer.ogg
  - type: StealTarget
    stealGroup: MedievalGetMedievalWeaponCrossbow
  - type: HeldSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
    mirrorClothingModifier: false
  - type: UseDelayOnMelee
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 6
  - type: TrashClear
    safe: true
  - type: Item
    size: Large
  - type: MedievalWeaponSkillCategory
    skill: Crossbow

