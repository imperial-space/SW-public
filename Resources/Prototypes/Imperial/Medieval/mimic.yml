#pet
- type: entity
  name: little mimic
  parent: SimpleMobBaseNoFood
  id: MedievalMobPetMimic
  description: The most unpredictable familiar, owing to the clot of darkness in his heart. He eats absolutely anything, sticks his tentacles where they don't belong, and loves imitating humans.
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 2.5
  - type: Sprite
    drawdepth: SmallMobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: mimike_pet_active
      sprite: Imperial/Medieval/Mobs/mimic/pet.rsi
  - type: SpriteMovement
    movementLayers:
      movement:
        state: mimike_pet_walk
    noMovementLayers:
      movement:
        state: mimike_pet_active
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mimike_pet_active
      Dead:
        Base: mimike_pet_idel
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-pet-mimic
    interactFailureString: petting-failure-corrupted-corgi
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_meow.ogg
  - type: Bloodstream
    bloodMaxVolume: 0
  - type: MeleeWeapon
    altDisarm: false
    # range: 1.80
    hidden: true
    attackRate: 1
    angle: 0
    soundHit:
     collection: AlienClaw
    animation: WeaponArcBite
    damage:
      groups:
        Brute: 8
      types:
        ParryAble: 1
        Caustic: 0.5
        Structural: 10
        Bloodloss: 1
  - type: NoSlip
  - type: Puller
    needsHands: false
  - type: Alerts
  - type: Familiar
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - Animal #Этот тег убирает из колеса эмоций мобов "человеческие" эмоции (чихание, свист и т.д)
    - Goliath
    - MedievalMob
    - FootstepSound
  - type: GhostTakeoverAvailable
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-pet-mimic-name
    description: ghost-role-information-pet-mimic-description
    rules: ghost-role-information-pet-mimic-rules
  # - type: Item
  - type: IgniteOnMeleeHit
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        offset: 0.35
        spawn:
          Log:
            min: 1
            max: 1
          PresentRandomMimic:
            min: 1
            max: 1          
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Imperial/Medieval/ES_Wood_Break_8_-_SFX_Producer.ogg
          params:
            volume: -6
  - type: LanguageSpeaker
    languages:
      Common: BadSpeak
      # Goblin: BadSpeak
      # Ancient: BadSpeak
      # Tribe: BadSpeak
      # Orc: BadSpeak
      Cursed: BadSpeak
      # Growling: BadSpeak
      # Hissing: BadSpeak
      # Elf: BadSpeak
  - type: MedievalDash
    force: 350
  - type: IgnoreSpiderWeb
  - type: MedievalPlagueInfectOnHit
    active: false
    id: Animal
    chance: 0.12
  - type: NPCUseActionOnTarget
    actionId: ActionGoliathTentacle
  - type: Storage
    grid:
    - 0,0,7,7
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Grammar
    attributes:
      proper: true
  - type: Vocalizer
    minVocalizeInterval: 30
    maxVocalizeInterval: 120 # polly is chattier
  - type: ActiveListener
  - type: ParrotListener
  - type: ParrotMemory
  - type: Speech
    speechSounds: Cat
    speechVerb: SmallMob
    allowedEmotes: ['Scream']
  # - type: ReplacementAccent
    # accent: cat
  - type: Vocal
    sounds:
      Unsexed: MimicHuman
  - type: ForcedSleepImmune
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Imperial/Medieval/Mimic/step4.ogg
      params:
        volume: -10
  - type: LocalLight
    energy: 0.2
    radius: 2.8
  - type: Emoting
  - type: ActionGrant
    actions:
    - DionaReformActionPetMimicClose
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: Dumpable
