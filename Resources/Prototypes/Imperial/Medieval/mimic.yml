##################################################################################
#мимик деревянный

- type: entity
  id: MobMimicChestOpenPlayerAI
  parent: SimpleMobBaseNoFood
  name: goliath
  description: A massive beast that uses long tentacles to ensnare its prey, threatening them is not advised under any conditions.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: goliath
      sprite: Imperial/Medieval/Mobs/mimic/mimic.rsi
  - type: SpriteMovement
    movementLayers:
      movement:
        state: mimic-moving
    noMovementLayers:
      movement:
        state: goliath
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          DraftParticlesMimicClose:
            min: 1
            max: 1
          PresentRandomMimic:
            min: 1
            max: 1
  - type: MeleeWeapon
    altDisarm: false
    range: 1.80
    attackRate: 0.9
    hidden: true
    angle: 0
    soundHit:
     collection: AlienClaw
    animation: WeaponArcBite
    damage:
      groups:
        Brute: 9
      types:
        Slash: 9
        Structural: 25
        ParryAble: 1
        Caustic: 1
        Bloodloss: 3
  - type: StaminaDamageOnHit
    damage: 12
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Appearance
  - type: Puller
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: GoliathCompound
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
    - DoorBumpOpener
    - Animal #Этот тег убирает из колеса эмоций мобов "человеческие" эмоции (чихание, свист и т.д)
    - Goliath
    - MedievalMob
  - type: NoSlip
  - type: Bloodstream
    bloodMaxVolume: 0
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.8
        density: 50
        mask:
        - Impassable
        - HighImpassable
        layer:
        - MobLayer
  - type: MedievalUnthrowable
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Dead
  # - type: DamageStateVisuals
    # states:
      # Alive:
        # Base: goliath
      # Dead:
        # Base: dead
  - type: Reform
    actionPrototype: DionaReformActionMimicClose
    reformTime: 5
    popupText: Вы прячетесь.
    reformPrototype: MobMimicChestClosePlayer
  # - type: ReplacementAccent
    # accent: slimes
  - type: IgnoreSpiderWeb
  - type: MedievalTimedDespawn
    lifetime: 860
  # - type: DamageOnContact
    # damage:
      # types:
        # Structural: 150
  - type: Stamina
    excess: 150
  - type: MedievalPlagueInfectOnHit
    active: false
    id: Animal
    chance: 0.12
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Imperial/Medieval/Mimic/step4.ogg
  - type: ForcedSleepImmune
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 250
    damage:
      groups:
        Brute: -1
        Burn: -1
        Airloss: -0.5
        Toxin: -1
      types:
        Bloodloss: -1
        Cellular: -0.5
  - type: SpamEmitSound
    minInterval: 10
    maxInterval: 30
    sound:
      collection: MimicSound
      # params:
          # volume: 1
          # maxDistance: 20
          # variation: 0.01
  - type: SlowOnDamage
    speedModifierThresholds:
      10: 1
      50: 0.9
      100: 0.8
      150: 0.7
      200: 0.6
      240: 0.5
  - type: LanguageSpeaker
    languages:
      Common: BadSpeak
      Goblin: BadSpeak
      Ancient: BadSpeak
      Tribe: BadSpeak
      Orc: BadSpeak
      Cursed: BadSpeak
      Growling: BadSpeak
      Hissing: BadSpeak
      Elf: BadSpeak
  - type: Grammar
    attributes:
      proper: true
  - type: Vocalizer
    minVocalizeInterval: 5
    maxVocalizeInterval: 25 # polly is chattier
  - type: ActiveListener
  - type: ParrotListener
  - type: ParrotMemory
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: Vocal
    sounds:
      Unsexed: MimicHuman

- type: entity
  id: MobMimicChestClosePlayer
  parent: BaseControllable
  suffix: do not spawn
  name: mimicSPPlayer
  description: A banner displaying the Nanotrasen logo. It looks rather cheap.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: Imperial/Medieval/Decor/chest4.rsi
    layers:
    - state: base
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Icon
    sprite: Imperial/Medieval/Decor/chest4.rsi
    state: base
  - type: Transform
    noRot: true
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Clickable
  - type: GravityAffected
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Imperial/Medieval/ES_Wood_Break_8_-_SFX_Producer.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        offset: 0.35
        spawn:
          MedievalChestWithLoot4:
            min: 1
            max: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        mask:
        - SmallMobMask
        layer:
        - MachineLayer
        density: 1000
  - type: MedievalDiggAble
  - type: Tag
    tags:
      - Structure
      - Animal
  # Imperial Medieval Start
  - type: MedievalMeleeBadTarget
    safeToHitGroup: structure
  # Imperial Medieval End
  - type: Reform
    actionPrototype: DionaReformActionMimicOpen
    reformTime: 1
    popupText: Вы раскрываетесь.
    reformPrototype: MobMimicChestOpenPlayerAI
  - type: Appearance
  - type: ReplacementAccent
    accent: slimes
  - type: MovementSpeedModifier
    baseWalkSpeed : 0.1
    baseSprintSpeed : 0.1
  - type: InputMover
  - type: MobMover
  - type: IgnoreSpiderWeb

- type: entity
  id: MobMimicChestCloseAI
  parent: MobMimicChestClosePlayer
  suffix: spawn
  name: mimicSPAI
  description: A banner displaying the Nanotrasen logo. It looks rather cheap.
  placement:
    mode: SnapgridCenter
  components:
  - type: SpawnOnTrigger
    proto: DraftParticlesMimicOpen
  - type: DeleteOnTrigger
  - type: TriggerOnInteractUsing
  - type: TriggerOnInteractHand
  - type: TriggerOnActivate
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Imperial/Medieval/ES_Wood_Break_8_-_SFX_Producer.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        offset: 0.35
        spawn:
          DraftParticlesMimicOpen:
            min: 1
            max: 1
  - type: MedievalTimedDespawn
    lifetime: 600
  # - type: EntityStorage  #нету тригера на открытие/закрытие
    # IsCollidableWhenOpen: true

- type: entity
  parent: BaseAction
  id: DionaReformActionMimicClose
  name: Маскировка
  description: Маскирует тебя в обычный сундук.
  components:
  - type: Action
    icon:
      sprite: Imperial/Medieval/Decor/chest4.rsi
      state: base
    useDelay: 60
  - type: InstantAction
    event: !type:ReformEvent {}

- type: entity
  parent: BaseAction
  id: DionaReformActionMimicOpen
  name: Снять маскировку
  description: Раскрывает тебя.
  components:
  - type: Action
    icon:
      sprite: Imperial/Medieval/Decor/chest4.rsi
      state: base
    useDelay: 10
  - type: InstantAction
    event: !type:ReformEvent {}

- type: entity
  id: DraftParticlesMimicOpen
  components:
  - type: TimedDespawn
    lifetime: 1
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Imperial/Medieval/ES_Wood_Break_8_-_SFX_Producer.ogg
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: spawn
      sprite: Imperial/Medieval/Mobs/mimic/mimic.rsi
  - type: SpawnOnDespawn
    prototype: MobMimicChestOpenPlayerAI
  - type: Transform
    noRot: true

- type: entity
  id: DraftParticlesMimicClose
  components:
  - type: TimedDespawn
    lifetime: 1
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Imperial/Medieval/ES_Wood_Break_8_-_SFX_Producer.ogg
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: dead
      sprite: Imperial/Medieval/Mobs/mimic/mimic.rsi
  - type: SpawnOnDespawn
    prototype: MedievalChestWithLoot4
  - type: Transform
    noRot: true

