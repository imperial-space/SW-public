- type: entity
  parent: MedievalSpellBookBase
  id: SkillLearningGrimoire
  name: учебный гримуар
  description: Одно базовое заклинание бесплатно, остальные стоят на 100 эссенции дороже. Привязка свободного обычного гримуара перенесёт в него накопленную эссенцию, а эту книгу обратит в пепел.
  categories: [ HideSpawnMenu ]
  components:
  - type: SkillLearningStore
  - type: ImperialStore
    balance:
      MagicMedievalFire: 0
      MagicMedievalLight: 0
      MagicMedievalVodka: 0
      MagicMedievalEarth: 0
      MagicMedievalDarkness: 0
      ArchmagePoints: 0

- type: imperialListing
  id: SkillArchmagicFire
  name: skills-buy-archmagic
  description: skills-buy-archmagic-desc
  icon: { sprite: Imperial/Medieval/Misc/magic_book.rsi, state: icon }
  cost:
    MagicMedievalFire: 200
  categories:
  - MedievalFireSpells
  conditions:
  - !type:SkillArchmagicCondition

