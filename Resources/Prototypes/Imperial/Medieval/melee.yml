- type: entity
  name: MedievalDaggerShadow
  parent: [ BaseKnife, BaseDaggerCharged ]
  id: MedievalDaggerShadow
  description: A deadly knife intended for melee confrontations.
  components:
  - type: QuestItem
    contractName: "любые кинжалы"
  - type: Sprite
    sprite: Imperial/Medieval/Melee/shadow_dagger.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Medieval/Melee/shadow_dagger.rsi
  - type: MeleeParry
  - type: MeleeWeapon
    attackRate: 1.35
    clickDamageModifier: 1.33
    range: 1.15
    damage:
      types:
        Slash: 17.5
        Caustic: 0.5
        ParryAble: 1
    resetOnHandSelected: false
    soundHit:
      path: /Audio/Imperial/Medieval/ES_Knife_Stab_2_-_SFX_Producer.ogg
    animation: CP14WeaponArcThrust
    wideAnimation: CP14WeaponArcSlash
    cPSwingBeverage: true
    cPAnimationOffset: 0.8
