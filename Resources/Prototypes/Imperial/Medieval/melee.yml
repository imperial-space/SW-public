- type: entity
  name: wooden shield
  parent: BaseShield
  id: MedievalWoodenShieldKnight
  description: Wooden shield.
  components:
    - type: RDWeight
      value: 7
    - type: Sprite
      sprite: Imperial/Medieval/Shields/woodknight.rsi
      state: shield
    - type: Item
      sprite: Imperial/Medieval/Shields/woodknight.rsi
      size: Ginormous
    - type: Clothing
      equipDelay: 2
      unequipDelay: 2
      quickEquip: false
      slots:
      - suitStorage
    - type: Blocking
      passiveBlockModifier: #PassiveMedievalWoodenShieldBlock
        coefficients:
          Blunt: 0.77
          Slash: 0.75
          Piercing: 0.75
          Heat: 0.8
      activeBlockModifier: #ActiveMedievalWoodenShieldBlock
        coefficients:
          Blunt: 0.7
          Slash: 0.67
          Piercing: 0.7
          Heat: 0.75
        #flatReductions:
        #  Blunt: 2.5
        #  Slash: 2.5
        #  Piercing: 2.5
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 330
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound: /Audio/Imperial/Medieval/ES_Wood_Break_8_-_SFX_Producer.ogg
    - type: Damageable
      damageContainer: Shield
    #- type: ShieldRegen
      #health: 28

