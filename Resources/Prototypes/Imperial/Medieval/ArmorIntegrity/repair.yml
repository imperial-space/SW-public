- type: entity
  parent: BaseItem
  id: MedievalSewingNeedle
  name: sewing needle
  description: Sewing needle for leather armor repairs
  components:
  - type: RDWeight
    value: 0.05
  - type: Sprite
    sprite: Imperial/Medieval/Misc/repairkit.rsi
    state: needle
  - type: Item
    size: Tiny
  - type: MedievalRepairArmor
    repairType: Sewing
    repairAmount: 20
    isSpendable: false
    repairTime: 5
    maxArmorRemove: 1
    skilledCrafterMaxArmorRemovalModifier: 0.5
    useSound:
      path: /Audio/Imperial/Medieval/craft_cloth.ogg

