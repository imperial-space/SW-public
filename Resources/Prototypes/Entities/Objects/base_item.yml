- type: entity
  name: "item"
  id: BaseItem
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
  - type: Pullable
  - type: DamageExaminable
  - type: UseDelayOnMelee # imperial medieval start
  - type: UseDelay
    delay: 0.1
  - type: Customizable
  - type: RDWeight
    value: 0.2
  - type: RDWeightExamine
    examines:
      "Вес: [color=#A8FF99]невесомый[/color]":
        min: 0
        max: 0.05   # вес пера
      "Вес: [color=#7DFF66]легкий[/color]":
        min: 0.05
        max: 0.22   # CURSE OF 220
      "Вес: [color=#ADFF2F]небольшой[/color]":
        min: 0.22
        max: 1      # вес смартфона или книги
      "Вес: [color=#D4FF33]ощутимый[/color]":
        min: 1
        max: 3      # вес ноутбука
      "Вес: [color=#FFFF00]умеренный[/color]":
        min: 3
        max: 7      # вес домашней кошки
      "Вес: [color=#FFD700]увесистый[/color]":
        min: 7
        max: 15     # вес тяжелого рюкзака
      "Вес: [color=#FFBF00]довольно тяжелый[/color]":
        min: 15
        max: 25     # вес микроволновки
      "Вес: [color=#FF8C00]тяжелый[/color]":
        min: 25
        max: 40     # вес мешка с цементом
      "Вес: [color=#FF4500]очень тяжелый[/color]":
        min: 40
        max: 55     # вес крупной собаки
      "Вес: [color=#FF0000]громоздкий[/color]":
        min: 55
        max: 70     # вес среднего человека
      "Вес: [color=#DC143C]весьма солидный[/color]":
        min: 70
        max: 85     # вес крупного человека
      "Вес: [color=#B22222]чрезвычайно тяжелый[/color]":
        min: 85
        max: 100    # вес наковальни
      "Вес: [color=#8B0000]невероятно тяжелый[/color]":
        min: 100
        max: 120    # вес холодильника
      "Вес: [color=#800000]почти неподъемный[/color]":
        min: 120
        max: 135    # вес мотоциклетного двигателя
      "Вес: [color=#660000]недвижимый[/color]":
        min: 135
        max: 25000    # вес пианино
  - type: RDWeightThrowModifier
    curve: !type:RDWeightModifierLinearCurve
      min: 5
      max: 20
  - type: TrashClear
  #- type: MedievalWeaponSkillCategory
  #  skill: Throwing # imperial medieval end

- type: entity
  name: "storage item"
  id: BaseStorageItem
  parent: BaseItem
  abstract: true
  components:
  - type: Storage
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []

- type: entity
  id: BaseBagOpenClose
  abstract: true
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState: # You don't have to use both of these if its not necessary.
        closeLayer:
          Open: { visible: false }
          Closed: { visible: true }
        openLayer:
          Open: { visible: true }
          Closed: { visible: false }

# Defines the behavior (but not the visuals!) for attaching paper labels to objects (e.g crates, parcels).
# Use this (NOT BasePaperLabelableVisualized) if the child prototype allows paper labels but has no sprites for it.
# Note that if an entity has its own ContainerContainer component then paper_label needs to be added to that too, or else there's bugs.
- type: entity
  id: BasePaperLabelable
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      paper_label: !type:ContainerSlot
  - type: ItemSlots
  - type: PaperLabel
    labelSlot:
      insertVerbText: comp-paper-label-insert
      ejectVerbText: comp-paper-label-eject
      whitelist:
        components:
        - Paper
      blacklist:
        tags:
        - Book

# Defines both the behavior (via parenting) and the visuals for attaching paper labels to objects (e.g crates, parcels).
# Use this (NOT BasePaperLabelable) if the child prototype has sprites for paper labels.
# The GenericVisualizer used here ONLY manages the paper label. If the child prototype has a unique GenericVisualizer for some reason or another,
# then that will also need to handle the paper label too, since it'll completely overwrite the one here.
# You should still parent from this instead of BasePaperLabelable since if that unique GenericVisualizer is missing for some reason this one works as a failsafe.
# (Though it might not really matter in practice.)
# In any case, the actual Sprite component for the label layer still needs to be defined on a per-item basis!
# And again note that if an entity has its own ContainerContainer component then paper_label needs to be added to that too, or else there's bugs.
- type: entity
  parent: BasePaperLabelable
  id: BasePaperLabelableVisualized
  abstract: true
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper: { state: paper }
          Bounty: { state: bounty }
          CaptainsPaper: { state: captains_paper }
          Invoice: { state: invoice }

# PowerCellSlot parents
